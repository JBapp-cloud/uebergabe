<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRISMA Übergabeprotokoll</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eb5b36">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Übergabe">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* === RESET === */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:15px;background:#ededed;color:#1a1a1a;min-height:100vh;-webkit-overflow-scrolling:touch;overflow-y:auto}
/* PWA safe-area (iPhone Notch) */
.sticky-top{padding-top:env(safe-area-inset-top)}
@supports(padding:env(safe-area-inset-top)){.header{padding-top:calc(14px + env(safe-area-inset-top))}}

/* === LAYOUT === */
.app{max-width:880px;margin:0 auto;padding:0 0 60px}
.sticky-top{position:sticky;top:0;z-index:50;will-change:transform;-webkit-transform:translateZ(0)}

/* === HEADER === */
.header{background:#fff;padding:14px 22px 11px;border-bottom:3px solid #eb5b36;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.header-left .app-title{font-size:16px;font-weight:700;color:#1a1a1a;line-height:1.2;letter-spacing:-.2px}
.header-left .app-sub{font-size:11px;color:#999;margin-top:1px}
@media(max-width:480px){
  .header{padding:10px 14px 9px}
  .header-left .app-title{font-size:14px}
}

/* === PROGRESS === */
.progress-bar{height:3px;background:#e0e0e0}
.progress-fill{height:3px;background:#eb5b36;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* === STEP TABS === */
.steps{display:flex;background:#fff;border-bottom:1px solid #e8e8e8;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-tab{flex:1;min-width:60px;padding:9px 4px 8px;text-align:center;font-size:9.5px;color:#bbb;cursor:pointer;border-right:1px solid #f0f0f0;user-select:none;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:color .15s,background .15s;position:relative;-webkit-tap-highlight-color:transparent}
.step-tab:last-child{border-right:none}
.step-tab .sn{font-size:15px;font-weight:700;display:block;line-height:1.1;margin-bottom:1px}
.step-tab.active{color:#eb5b36;background:#fff8f6}
.step-tab.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#eb5b36}
.step-tab.done{color:#444;background:#fafafa}
.zust-mini-row{display:flex;gap:5px;flex-shrink:0}
.zust-mini{width:38px;height:38px;border:none;background:none;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;border-radius:50%}
.zust-mini.on{background:#f5f5f5}
@media(max-width:500px){.step-tab{min-width:50px;font-size:8.5px;padding:7px 2px 6px}.step-tab .sn{font-size:13px}}

/* === CONTENT === */
.content-area{background:#fff;border:1px solid #e0e0e0;border-top:none;padding:26px 26px 22px;min-height:420px}
@media(max-width:600px){.content-area{padding:18px 15px 18px}}

/* === SECTION HEADERS === */
.sec-hd{font-size:10.5px;font-weight:700;color:#eb5b36;letter-spacing:1.2px;text-transform:uppercase;border-bottom:1.5px solid #fad5c9;padding-bottom:5px;margin:24px 0 15px}
.sec-hd:first-child{margin-top:0}

/* === OBJ BOX === */
.obj-box{border:1px solid #e0e0e0;padding:15px 17px;margin-bottom:20px;background:#fafafa;border-radius:1px}
.obj-row{display:flex;align-items:center;margin-bottom:11px;gap:10px}
.obj-row:last-child{margin-bottom:0}
.obj-lbl{font-weight:700;font-size:12.5px;color:#555;min-width:195px;flex-shrink:0}
.obj-val{flex:1}
.obj-val input{width:100%;border:none;border-bottom:1.5px solid #d0d0d0;font-size:16px;font-family:inherit;color:#1a1a1a;background:transparent;padding:4px 3px 3px;outline:none;-webkit-appearance:none;transition:border-color .15s}
.obj-val input:focus{border-bottom-color:#eb5b36}
@media(max-width:520px){
  .obj-row{flex-direction:column;align-items:flex-start;gap:3px}
  .obj-lbl{min-width:unset;font-size:11.5px;color:#777}
  .obj-val{width:100%}
}

/* === FIELD ROW === */
.field-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:145px}
.field-full{flex-basis:100%}
.field label{font-size:10.5px;font-weight:700;color:#888;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select{border:none;border-bottom:1.5px solid #d0d0d0;padding:6px 3px 4px;font-size:16px;font-family:inherit;color:#1a1a1a;background:transparent;outline:none;-webkit-appearance:none;border-radius:0;transition:border-color .15s}
.field-row-aligned .field input,.field-row-aligned .field select{height:34px;line-height:22px;box-sizing:border-box}
.field input:focus,.field select:focus{border-bottom-color:#eb5b36}

/* === CHECKBOXES === */
.cb-group{margin-bottom:18px}
.cb-row{display:flex;align-items:flex-start;gap:11px;font-size:14px;line-height:1.5;cursor:pointer;padding:10px 12px;border:1px solid #ebebeb;margin-bottom:7px;background:#fff;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.cb-row:hover{background:#fdf8f7;border-color:#f0c8be}
.cb-row input[type=checkbox]{width:19px;height:19px;min-width:19px;margin-top:2px;cursor:pointer;accent-color:#eb5b36;flex-shrink:0}
.cb-row.checked{background:#fff8f6;border-color:#f0c8be}

/* === TABLES === */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;border:1px solid #e0e0e0}
.tbl-scroll table{margin-bottom:0;min-width:500px;width:100%;border-collapse:collapse}
table.tbl th{padding:9px 11px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8;white-space:nowrap}
table.tbl td{padding:8px 9px;font-size:13.5px;vertical-align:middle;border-bottom:1px solid #ebebeb}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:#fafafa}
table.tbl input,table.tbl select{border:none;width:100%;font-size:16px;background:transparent;color:#1a1a1a;outline:none;font-family:inherit;padding:3px 2px}

/* === MANGEL TABLE === */
table.mg-tbl th{padding:9px 11px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8}
table.mg-tbl td{padding:8px 9px;font-size:13px;vertical-align:middle;border-bottom:1px solid #ebebeb}
table.mg-tbl tr:last-child td{border-bottom:none}
table.mg-tbl input,table.mg-tbl select{border:none;width:100%;font-size:16px;background:transparent;color:#1a1a1a;outline:none;font-family:inherit;padding:2px}

/* === CHECKLISTE === */
.cl-tbl{width:100%;border-collapse:collapse;margin-bottom:16px}
.cl-tbl th{padding:9px 12px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8}
.cl-tbl td{padding:9px 12px;font-size:13px;vertical-align:top;border-bottom:1px solid #ebebeb}
.cl-tbl td:first-child{font-weight:700;font-size:12px;width:120px;color:#333}
.cl-tbl td:last-child{width:60px;text-align:center}
.cl-tbl tr.checked-row td{background:#f9fff6}
.cl-tbl input[type=checkbox]{width:22px;height:22px;accent-color:#2a9d3b;cursor:pointer}

/* === SCHLÜSSEL ROW === */
.sk-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid #f0f0f0}
.sk-anz{width:52px;border:none;border-bottom:1.5px solid #d0d0d0;text-align:center;font-size:14px;font-family:inherit;background:transparent;outline:none;padding:4px 2px;-webkit-appearance:none}
.sk-lbl{font-size:13px;color:#777;white-space:nowrap}
.sk-sel,.sk-inp{border:none;border-bottom:1.5px solid #d0d0d0;font-size:13px;font-family:inherit;background:transparent;outline:none;padding:4px 3px;-webkit-appearance:none;border-radius:0}
.sk-sel{min-width:155px}
.sk-inp{flex:1;min-width:80px}

/* === BUTTONS === */
.btn-add{background:#fff;color:#333;border:1.5px solid #888;padding:9px 17px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;transition:background .12s,border-color .12s;display:inline-flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent;margin-bottom:12px}
.btn-add:hover{background:#f5f5f5;border-color:#333}
.btn-del{background:transparent;color:#ccc;border:1px solid #e0e0e0;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s,background .15s;min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.btn-del:hover{color:#e00;border-color:#e00;background:#fff0f0}

/* === FOTO === */
.foto-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #ccc;padding:5px 11px;font-size:11.5px;cursor:pointer;color:#666;font-family:inherit;transition:border-color .12s,color .12s;min-height:34px;-webkit-tap-highlight-color:transparent}
.foto-btn:hover{border-color:#555;color:#333}
.foto-thumb-wrap{position:relative;display:inline-block}
.foto-thumb{width:60px;height:60px;object-fit:cover;border:1px solid #ddd;display:block}
.foto-del-btn{position:absolute;top:-7px;right:-7px;background:#d00;color:#fff;border:none;width:18px;height:18px;font-size:9px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.foto-zone{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:5px}

/* === FOTO GRID === */
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:16px}
@media(max-width:480px){.foto-grid{grid-template-columns:repeat(2,1fr)}}
.foto-card{border:1px solid #e0e0e0;overflow:hidden;background:#fafafa}
.foto-card img{width:100%;height:112px;object-fit:cover;display:block}
.foto-card-foot{padding:5px 7px;display:flex;gap:5px;align-items:center;border-top:1px solid #f0f0f0}
.foto-card-foot input{border:none;font-size:11.5px;width:100%;background:transparent;outline:none;font-family:inherit;color:#666}

/* === SIGNATUR === */
.sig-grid{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 20px}
.sig-col{flex:1;min-width:210px}
.sig-lbl{font-size:11.5px;font-weight:700;color:#444;margin-bottom:7px;letter-spacing:.2px}
.sig-wrap{border:1.5px solid #ccc;background:#f8f8f8;position:relative;cursor:crosshair}
.sig-wrap canvas{display:block;width:100%;height:115px;touch-action:auto}
.sig-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#ccc;pointer-events:none;user-select:none;letter-spacing:.3px}
.sig-clear{background:#fff;border:1px solid #ccc;padding:5px 13px;font-size:11.5px;cursor:pointer;color:#666;margin-top:5px;font-family:inherit;transition:border-color .12s}
.sig-clear:hover{border-color:#555;color:#333}

/* === NAVIGATION === */
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;border-top:1px solid #e8e8e8;margin-top:20px;gap:10px;flex-wrap:wrap}
.btn-back{background:#fff;border:1.5px solid #aaa;padding:11px 22px;font-size:14px;cursor:pointer;color:#333;font-family:inherit;font-weight:700;transition:border-color .12s;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-back:hover{border-color:#333}
.btn-fwd{background:#1a1a1a;color:#fff;border:none;padding:11px 24px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;transition:background .15s;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-fwd:hover{background:#eb5b36}
.btn-print{background:#eb5b36;color:#fff;border:none;padding:11px 22px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;min-height:46px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-print:hover{background:#d04a28}
.btn-email{background:#fff;color:#1a1a1a;border:1.5px solid #555;padding:11px 20px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-email:hover{background:#f5f5f5}
.nav-right{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:500px){
  .nav-bar{flex-direction:column-reverse;align-items:stretch}
  .btn-back,.btn-fwd,.btn-print,.btn-email{width:100%;text-align:center;justify-content:center}
  .nav-right{flex-direction:column;width:100%}
}

/* === HINTS & ALERTS === */
.hint{background:#fdf6f4;border:1px solid #f5d0c5;border-left:3px solid #eb5b36;padding:12px 15px;font-size:12.5px;color:#666;margin-bottom:15px;line-height:1.65}
.info-empty{text-align:center;padding:20px 0;font-size:13px;color:#bbb;border-bottom:1px solid #f0f0f0;margin-bottom:10px}
.warn-box{border-left:3px solid #eb5b36;background:#fdf6f4;padding:9px 13px;font-size:12.5px;margin-bottom:12px;color:#666}

/* === TOAST === */
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;font-size:11.5px;padding:7px 15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* === LOADING === */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:200;font-size:13px;color:#888;display:none}
.loading-overlay.active{display:flex}


/* === ZUSTAND BADGE === */
.zust-row{display:flex;gap:7px;margin:8px 0 4px;flex-wrap:wrap}
.zust-btn{border:1.5px solid #ddd;background:#fff;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;font-family:inherit;border-radius:2px;transition:all .12s;min-height:36px;-webkit-tap-highlight-color:transparent;letter-spacing:.3px}
.zust-btn:hover{border-color:#aaa}
.zust-btn.sel-gut{background:#e8f7ec;border-color:#4caf50;color:#1b7a2e}
.zust-btn.sel-mittel{background:#fff8e6;border-color:#f0a500;color:#8a5c00}
.zust-btn.sel-schlecht{background:#fdecea;border-color:#e53935;color:#b71c1c}

/* === RAUM-FOTO BLOCK (in Mängel) === */
.raum-block{border:1px solid #e8e8e8;margin-bottom:14px;background:#fff}
.raum-block-hd{display:flex;align-items:center;gap:10px;padding:12px 15px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.raum-block-hd .rb-name{font-weight:700;font-size:14px;flex:1}
.raum-block-hd .rb-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:2px}
.rb-badge.gut{background:#e8f7ec;color:#1b7a2e}
.rb-badge.mittel{background:#fff8e6;color:#8a5c00}
.rb-badge.schlecht{background:#fdecea;color:#b71c1c}
.rb-badge.none{background:#f0f0f0;color:#aaa}
.raum-block-hd .rb-toggle{font-size:13px;color:#aaa;margin-left:4px;transition:transform .2s}
.raum-block-hd.open .rb-toggle{transform:rotate(180deg)}
.raum-block-body{padding:14px 15px;display:none}
.raum-block-body.open{display:block}

/* === MANGEL CARD === */
.mangel-card{background:#fff8f6;border:1px solid #f5d0c5;padding:11px 13px;margin-bottom:9px;position:relative}
.mangel-card-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.mangel-card textarea{width:100%;border:none;border-bottom:1.5px solid #e0d0d0;font-size:13.5px;font-family:inherit;background:transparent;outline:none;padding:3px 2px;resize:none;min-height:38px}
.mangel-card textarea:focus{border-bottom-color:#eb5b36}

/* === FOTO GRID (Raum-Fotos) === */
.rfoto-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;align-items:flex-start}
.rfoto-item{position:relative;width:80px}
.rfoto-img{width:80px;height:80px;object-fit:cover;display:block;border:1px solid #e0e0e0}
.rfoto-del{position:absolute;top:-6px;right:-6px;background:#c00;color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rfoto-lbl{font-size:10px;color:#888;width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rfoto-add{width:80px;height:80px;border:2px dashed #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;font-size:11px;color:#bbb;gap:4px;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
.rfoto-add:hover,.rfoto-add:active{border-color:#eb5b36;background:#fff8f6;color:#eb5b36}
.rfoto-add span{font-size:22px;line-height:1}

/* === DOWNLOAD BUTTON === */

// ── IMAGE RESIZE ───────────────────────────────────────────────────────────
function resizeImg(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=900,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX&&h>w){w=Math.round(w*MAX/h);h=MAX;}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── SAVE CURRENT STEP TO D ────────────────────────────────────────────────
function saveStep(){
  var i,el;
  if(cur===0){
    var prevDatum=D.datum;
    ["typ","datum","objekt","top","eigentuemer","mieter","email_mieter","telefon","kfz","verwalter","anbieter","strom_bis","strom_person","iban","nachfolge"].forEach(function(k){el=ge("f_"+k);if(el)D[k]=el.value;});
    if(D.datum&&D.datum!==prevDatum){
      D.zaehler.forEach(function(z){if(!z.ablese||z.ablese===prevDatum)z.ablese=D.datum;});
    }
    el=ge("cb_2");if(el)D.cb[2]=el.checked;
    var ttl=ge("app-title");if(ttl)ttl.textContent=protTitle();
  }
  if(cur===1){
    for(i=0;i<D.schluessel.length;i++){
      var se=ge("sk_sel_"+i),ae=ge("sk_anz_"+i),ne=ge("sk_nr_"+i),ce=ge("sk_cust_"+i);
      if(ae)D.schluessel[i].anz=ae.value;
      if(ne)D.schluessel[i].nr=ne.value;
      if(se){D.schluessel[i]._sel=se.value;D.schluessel[i].art=(se.value==="Sonstiges"&&ce&&ce.value)?ce.value:se.value;}
    }
  }
  if(cur===2){
    for(i=0;i<D.zaehler.length;i++){
      var zse=ge("zae_sel_"+i),zne=ge("zae_nr_"+i),zst=ge("zae_st_"+i),zab=ge("zae_ab_"+i),zeh=ge("zae_eh_"+i),zce=ge("zae_cust_"+i);
      if(zne)D.zaehler[i].nr=zne.value;
      if(zst)D.zaehler[i].stand=zst.value;
      if(zab)D.zaehler[i].ablese=zab.value;
      if(zeh)D.zaehler[i].einheit=zeh.value;
      if(zse){D.zaehler[i]._sel=zse.value;D.zaehler[i].art=(zse.value==="Sonstiges"&&zce&&zce.value)?zce.value:zse.value;}
    }
  }
  // cur===3 = Fotos: saves inline
  if(cur===4){saveMangelStep();}
  if(cur===5){
  }
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function goStep(n){
  if(n===cur)return;
  saveStep();
  visited[cur]=true; // mark current step as visited before leaving
  persist(); // Auto-Save in aktuellen Entwurf
  cur=n;render();scrollTop();
}

// ── SCHRITT-VOLLSTÄNDIGKEIT (für Haken + "Was fehlt noch?") ────────────────
// Gibt true zurück, wenn der Schritt echten Inhalt hat (nicht nur besucht wurde).
function stepHasContent(i){
  if(i===0) return !!(D.objekt||D.mieter||D.eigentuemer);
  if(i===1) return D.schluessel.some(function(s){return s.anz;});
  if(i===2) return D.zaehler.some(function(z){return z.stand||z.nr;});
  if(i===3) return D.fotos.length>0;
  if(i===4) return D.raeume.some(function(r){return r.zustand||(r.beschreibung&&r.beschreibung.trim())||(r.fotos&&r.fotos.length);});
  if(i===5) return !!(D.sig_v||D.sig_m);
  return false;
}

// ── RENDER ────────────────────────────────────────────────────────────────
var STEP_FNS=null;
function render(){
  var bar=ge("stepbar");
  bar.innerHTML=STEP_LABELS.map(function(s,i){
    var done=stepHasContent(i);
    var cls="step-tab"+(i===cur?" active":done?" done":"");
    return'<div class="'+cls+'" onclick="goStep('+i+')" title="'+s+'">'+
      '<span class="sn">'+(done?"✓ ":"")+(i+1)+'</span>'+s+
    '</div>';
  }).join("");
  ge("prog-lbl").textContent="Schritt "+(cur+1)+" von "+STEP_LABELS.length;
  ge("prog-fill").style.width=Math.round((cur+1)/STEP_LABELS.length*100)+"%";
  var ttl=ge("app-title");if(ttl)ttl.textContent=protTitle();
  var c=ge("content");c.innerHTML="";
  var fn=STEP_FNS[cur];
  if(fn.returnsHtml){c.innerHTML=fn();}else{fn(c);}
}

function navBar(hasPrev,hasNext,nextLabel){
  return'<div class="nav-bar">'+
    (hasPrev?'<button class="btn-back" onclick="goStep('+( cur-1)+')">← Zurück</button>':"<span></span>")+
    '<div class="nav-right">'+
      (hasNext?'<button class="btn-fwd" onclick="goStep('+( cur+1)+')">'+( nextLabel||"Weiter →")+'</button>':"")
    +'</div></div>';
}

}

  '</select>';

  return'<label class="foto-btn">'+icn("cam",14)+' '+label+'<input type="file" accept="image/*" capture="environment" style="display:none" onchange="'+onch+'">'+'</label>';

  var list=document.createElement("div");

  var fill=sel?col:"#f1f1f1";

  var mouth={
    gut:'<path d="M7.2 13.2 q4.8 4.4 9.6 0" stroke="'+face+'" stroke-width="1.9" fill="none" stroke-linecap="round"/>',
    mangel:'<line x1="7.8" y1="14.2" x2="16.2" y2="14.2" stroke="'+face+'" stroke-width="1.9" stroke-linecap="round"/>'
  }[type];
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.4" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/><circle cx="8.5" cy="9.2" r="1.5" fill="'+face+'"/><circle cx="15.5" cy="9.2" r="1.5" fill="'+face+'"/>'+mouth+'</svg>';

function rotFoto(i){
  var f=D.fotos[i];if(!f||!f.data)return;
  var im=new Image();
  im.onload=function(){
    var c=document.createElement("canvas");
    c.width=im.height;c.height=im.width;
    var x=c.getContext("2d");
    x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);
    x.drawImage(im,-im.width/2,-im.height/2);

function objMitTop(){

var OBJ_KUERZEL={
  "STADTWERK, Hochhaus, Strubergasse 26, 5020 Salzburg":"STG26",
  "STADTWERK, Strubergasse 18, 5020 Salzburg":"STG18",
  "STADTWERK West, Rosseggerstraße 4, 5020 Salzburg":"ROS4",

function objKuerzel(){
  var name=(D.objekt||"").trim();
  if(OBJ_KUERZEL[name])return OBJ_KUERZEL[name];
  // Auto: erste 3 Buchstaben des Straßennamens + Hausnummer (PLZ-Segmente ignorieren)
  var segs=name.split(",");
  for(var i=0;i<segs.length;i++){
    var s=segs[i].trim();
    if(/^\d{4,5}\s/.test(s))continue; // PLZ+Ort
    var m=s.match(/([A-Za-zÄÖÜäöüß]+)[^\d]*?(\d+)\s*[a-zA-Z]?\s*$/);
    if(m){
      var st=m[1].replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss");
      return (st.substring(0,3).toUpperCase())+m[2];
    }
  }
  return "";
}

function updateSigHint(wrapId){

function initPad(canvasId,wrapId){
  var cv=ge(canvasId),ctx=cv.getContext("2d"),drawing=false,last=null,hasDrawn=false;
  function pos(e){var r=cv.getBoundingClientRect(),src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(cv.width/r.width),y:(src.clientY-r.top)*(cv.height/r.height)};}
  function draw(p){ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
  function hint(){if(wrapId)updateSigHint(wrapId);else if(typeof sigOvHint==="function")sigOvHint(false);}
  cv.addEventListener("mousedown",function(e){drawing=true;last=pos(e);hasDrawn=true;hint();});
  cv.addEventListener("mousemove",function(e){if(drawing)draw(pos(e));});
  cv.addEventListener("mouseup",function(){drawing=false;});
  cv.addEventListener("mouseleave",function(){drawing=false;});
  cv.addEventListener("touchstart",function(e){
    e.preventDefault();
    cv.style.touchAction="none";
    drawing=true;last=pos(e);hasDrawn=true;hint();
  },{passive:false});
  cv.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(drawing)draw(pos(e));
  },{passive:false});
  cv.addEventListener("touchend",function(){
    drawing=false;
    cv.style.touchAction="auto";
  });
  cv.addEventListener("touchcancel",function(){
    drawing=false;
    cv.style.touchAction="auto";
  });
  return{
    cv:cv,ctx:ctx,
    toDataURL:function(){return cv.toDataURL("image/png");},
    markDrawn:function(){hasDrawn=true;},
    reset:function(){hasDrawn=false;},
    isEmpty:function(){if(!hasDrawn)return true;var d=ctx.getImageData(0,0,cv.width,cv.height).data;for(var i=3;i<d.length;i+=4){if(d[i]>10)return false;}return true;}
  };
}

      '<div style="font-size:11px;color:#888;font-weight:700;letter-spacing:.6px;text-transform:uppercase">Unterschrift</div>'+
      '<div style="font-size:16px;font-weight:700;color:#1a1a1a;margin-top:2px">'+esc(wer)+'</div>'+
    '</div>'+
    '<div style="flex:1;position:relative;margin:14px 14px 0">'+
      '<canvas id="sig-ov-cv" style="position:absolute;inset:0;width:100%;height:100%;border:1.5px dashed #ccc;border-radius:10px;background:#fdfdfd;touch-action:none"></canvas>'+
      '<div style="position:absolute;left:8%;right:8%;bottom:22%;border-bottom:1.5px solid #d8d8d8;pointer-events:none"></div>'+
      '<div id="sig-ov-hint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:15px;pointer-events:none">Hier unterschreiben</div>'+
    '</div>'+
    '<div style="flex-shrink:0;display:flex;gap:10px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))">'+
      '<button type="button" onclick="sigOvClear()" style="flex:1;padding:14px;border:1.5px solid #ccc;background:#fff;color:#444;font-size:14px;font-weight:700;font-family:inherit;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none">Löschen</button>'+
      '<button type="button" onclick="closeSigOverlay()" style="flex:1;padding:14px;border:1.5px solid #ccc;background:#fff;color:#444;font-size:14px;font-weight:700;font-family:inherit;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none">Abbrechen</button>'+
      '<button type="button" onclick="sigOvSave()" style="flex:1.4;padding:14px;border:none;background:#eb5b36;color:#fff;font-size:14px;font-weight:700;font-family:inherit;border-radius:9px;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none">Übernehmen</button>'+
    '</div>';
  document.body.appendChild(ov);
  // Canvas in Displayauflösung aufziehen (scharfe Striche)
  var cv=ge("sig-ov-cv");
  var rect=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);
  sigPad=initPad("sig-ov-cv",null);
  // Vorhandene Unterschrift zum Korrigieren laden
  var ex=(which==="v"?D.sig_v:D.sig_m);
  if(ex){var im=new Image();im.onload=function(){sigPad.ctx.drawImage(im,0,0,cv.width,cv.height);sigOvHint(false);sigPad.markDrawn();};im.src=ex;}
}
function sigOvHint(show){var hn=ge("sig-ov-hint");if(hn)hn.style.display=show?"flex":"none";}
function sigOvClear(){
  if(!sigPad)return;
  sigPad.ctx.clearRect(0,0,sigPad.cv.width,sigPad.cv.height);
  sigPad.reset();sigOvHint(true);
}
function closeSigOverlay(){var ov=ge("sig-ov");if(ov)ov.parentNode.removeChild(ov);sigPad=null;sigWhich=null;}
function sigOvSave(){
  if(!sigPad)return;
  var empty=sigPad.isEmpty();
  var d=empty?null:sigPad.toDataURL();
  var ts=empty?null:new Date().toISOString();
  if(sigWhich==="v"){D.sig_v=d;D.sig_v_ts=ts;}else{D.sig_m=d;D.sig_m_ts=ts;}
  persist();closeSigOverlay();render();
}

var _acOpen=false;

function acFilter(val,inputEl){
  // Remove existing list
  var old=ge("ac-list");if(old&&old.parentNode)old.parentNode.removeChild(old);
  if(!val||val.length<1||!OBJEKTE.length){_acOpen=false;return;}

  var q=val.toLowerCase();
  var matches=OBJEKTE.filter(function(o){
    return o.name.toLowerCase().indexOf(q)>=0||
           (o.eigentuemer&&o.eigentuemer.toLowerCase().indexOf(q)>=0);
  });
  if(!matches.length){_acOpen=false;return;}

  var list=document.createElement("div");
  list.id="ac-list";
  list.className="ac-list";
  matches.slice(0,8).forEach(function(o){
    var item=document.createElement("div");
    item.className="ac-item";
    // Highlight matching part
    var safe=q.replace(/[-.*+?^${}()|\[\]\\]/g,"\\$&");
    var hl=o.name.replace(new RegExp("("+safe+")","gi"),"<strong>$1</strong>");
    item.innerHTML=hl+(o.eigentuemer?'<small>'+esc(o.eigentuemer)+'</small>':'');
    item.onmousedown=item.ontouchstart=function(e){
      e.preventDefault();
      acSelect(o);
    };
    list.appendChild(item);
  });

  // Insert after input
  var wrap=inputEl.closest(".ac-wrap")||inputEl.parentNode;
  wrap.appendChild(list);
  _acOpen=true;
}

function acSelect(o){
  var elName=ge("f_objekt");
  var elOwner=ge("f_eigentuemer");
  if(elName){elName.value=o.name;D.objekt=o.name;}
  if(elOwner&&o.eigentuemer){elOwner.value=o.eigentuemer;D.eigentuemer=o.eigentuemer;}
  var old=ge("ac-list");if(old&&old.parentNode)old.parentNode.removeChild(old);
  _acOpen=false;
  toast("Objekt übernommen",1200);
}

function acClose(){
  var old=ge("ac-list");
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  _acOpen=false;
}

      '<button onclick="burstShot()" type="button" aria-label="Auslöser" style="width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent"></button>'+
    '</div>';
  document.body.appendChild(ov);
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}},audio:false})
    .then(function(st){_burstStream=st;var v=ge("burst-video");if(v)v.srcObject=st;})
    .catch(function(){closeBurst();toast("Kamera-Zugriff verweigert – bitte in den iPhone-Einstellungen für Safari erlauben",3500);});
}
function burstShot(){
  var v=ge("burst-video");if(!v||!v.videoWidth)return;
  var MAX=900,w=v.videoWidth,h2=v.videoHeight;
  if(w>=h2&&w>MAX){h2=Math.round(h2*MAX/w);w=MAX;}
  else if(h2>w&&h2>MAX){w=Math.round(w*MAX/h2);h2=MAX;}
  // WYSIWYG: gespeichert wird exakt das Vorschaubild (keine Drehberechnung)
  var c=document.createElement("canvas");c.width=w;c.height=h2;
  c.getContext("2d").drawImage(v,0,0,w,h2);
  D.fotos.push({data:c.toDataURL("image/jpeg",0.72),bez:""});
  _burstN++;persist();
  var cnt=ge("burst-count");if(cnt)cnt.textContent=_burstN+" Foto"+(_burstN===1?"":"s");
  var fl=ge("burst-flash");if(fl){fl.style.opacity=".7";setTimeout(function(){fl.style.opacity="0";},110);}
}
function closeBurst(){
  if(_burstStream){_burstStream.getTracks().forEach(function(t){t.stop();});_burstStream=null;}
  var ov=ge("burst-ov");if(ov)ov.parentNode.removeChild(ov);
  render();
  if(_burstN>0)toast(_burstN+" Foto"+(_burstN===1?"":"s")+" übernommen",1800);
}

// Erzeugt ein echtes PDF (PDF 1.4, Helvetica/WinAnsi, JPEG-Bilder) rein clientseitig.
var APP_VERSION="v15";

function jpegDim(bin){
  var i=2,L=bin.length;
  while(i<L-9){
    if(bin.charCodeAt(i)!==0xFF){i++;continue;}
    var m=bin.charCodeAt(i+1);
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){
      return{h:((bin.charCodeAt(i+5)<<8)|bin.charCodeAt(i+6)),w:((bin.charCodeAt(i+7)<<8)|bin.charCodeAt(i+8))};
    }
    i+=2+((bin.charCodeAt(i+2)<<8)|bin.charCodeAt(i+3));
  }
  return{w:400,h:300};
}
function pdfEnc(s){
  s=String(s==null?"":s);var o="";
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c===8364)c=128;               // €
    if(c===8211||c===8212)c=45;      // – —
    if(c===8216||c===8217)c=39;      // ' '
    if(c===8220||c===8221)c=34;      // " "
    if(c===8230){o+="...";continue;} // …
    if(c>255)c=63;                   // ?
    if(c===92||c===40||c===41)o+="\\"+String.fromCharCode(c);
    else if(c<32||c>126)o+="\\"+("00"+c.toString(8)).slice(-3);
    else o+=String.fromCharCode(c);
  }
  return o;
}
function twd(s,size,bold){
  s=String(s==null?"":s);var w=0;
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if("il.,:;'!|()[]jtfrI ".indexOf(ch)>=0)w+=0.31;
    else if("MWm@".indexOf(ch)>=0)w+=0.9;
    else if(ch>="A"&&ch<="Z")w+=0.7;
    else if(ch>="0"&&ch<="9")w+=0.58;
    else w+=0.55;
  }
  return w*size*(bold?1.06:1);
}
function twrap(s,size,bold,maxw){
  var words=String(s==null?"":s).split(/\s+/),lines=[],curl="";
  for(var i=0;i<words.length;i++){
    var t=curl?curl+" "+words[i]:words[i];
    if(twd(t,size,bold)<=maxw||!curl)curl=t;else{lines.push(curl);curl=words[i];}
  }
  if(curl)lines.push(curl);
  return lines.length?lines:[""];
}

      var fx=M+24,fy=y1+3,fc=0;

        img(f.data,fx,fy,84,56);
        fx+=92;fc++;
        if(fc===3){fc=0;fx=M+24;fy+=62;}
      });
      yy+=subH-3;
    }
  });

  // ── Beilage Fotos (2 große Fotos pro Seite, volle Breite)
  if(hatFotos){
    var fb=beil.indexOf("Fotodokumentation")+1;
    np();header("Beilage "+fb+": Fotodokumentation");
    var ph2=315;
    allFotos.forEach(function(f,fi){
      if(yy+ph2+18>PH-BOT){np();header("Beilage "+fb+": Fotodokumentation (Fortsetzung)");yy+=4;}
      rect(M,yy,CW,ph2,0.5,0.78);
      img(f.data,M+2,yy+2,CW-4,ph2-4);
      var cap="Foto "+(fi+1)+(f.bez?" - "+f.bez:"");
      txt(M,yy+ph2+4,twrap(cap,8.5,false,CW)[0],8.5,false,0.4);
      yy+=ph2+24;
    });
  }

  // ── Fußzeilen (Seitenzahl rechtsbündig am Satzspiegelrand)
  var total=pages.length;
  pages.forEach(function(p,i){
    pg=p;
    hline(M,PW-M,PH-34,0.4,0.75);
    var pgTxt="Seite "+(i+1)+" von "+total;
    var pgW=twd(pgTxt,8.5,false);
    txt(M,PH-30,twrap(docName,8.5,false,CW-pgW-14)[0],8.5,false,0.5);
    txt(PW-M-pgW,PH-30,pgTxt,8.5,false,0.5);
  });

  // ── PDF zusammensetzen
  var nImg=imgs.length,pageObjStart=5+nImg;
  var objs=[];
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  var kids=[];for(var i=0;i<pages.length;i++)kids.push((pageObjStart+2*i)+" 0 R");
  objs.push("<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  imgs.forEach(function(im){
    objs.push("<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.bin.length+" >>\nstream\n"+im.bin+"\nendstream");
  });
  var xo=[];for(var i2=0;i2<nImg;i2++)xo.push("/Im"+(i2+1)+" "+(5+i2)+" 0 R");
  var res="<< /Font << /F1 3 0 R /F2 4 0 R >> "+(nImg?"/XObject << "+xo.join(" ")+" >> ":"")+">>";
  pages.forEach(function(p){
    var cs=p.ops.join("\n");
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources "+res+" /Contents "+(pageObjStart+2*pages.indexOf(p)+1)+" 0 R >>");
    objs.push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  });
  var head="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n",body="",offs=[];
  objs.forEach(function(ob,i){offs.push(head.length+body.length);body+=(i+1)+" 0 obj\n"+ob+"\nendobj\n";});
  var xref=head.length+body.length;
  var xr="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  offs.forEach(function(of){xr+=("0000000000"+of).slice(-10)+" 00000 n \n";});
  var s=head+body+xr+"trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  var u=new Uint8Array(s.length);
  for(var k=0;k<s.length;k++)u[k]=s.charCodeAt(k)&0xFF;
  return u;
}

function sigToJpeg(dataUrl,cb){
  if(!dataUrl){cb(null);return;}
  var im=new Image();
  im.onload=function(){
    var c=document.createElement("canvas");c.width=im.width||400;c.height=im.height||115;
    var x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
    cb(c.toDataURL("image/jpeg",0.92));
  };
  im.onerror=function(){cb(null);};
  im.src=dataUrl;
}
function pdfFileName(){
  // Schema: JJJJ_MM_TT_Kürzel_Wohnungsübergabe_TopX (Kürzel entfällt ohne erkennbare Adresse)
  var datum=(D.datum||todayISO()).replace(/-/g,"_");
  var k=objKuerzel();
  var typLabel=istRuecknahme()?"Wohnungsrücknahme":"Wohnungsübergabe";
  var top=(D.top||"").replace(/[^A-Za-z0-9]/g,"");
  return datum+(k?"_"+k:"")+"_"+typLabel+(top?"_Top"+top:"")+".pdf";
}
function mailSubject(){
  var typLabel=istRuecknahme()?"Wohnungsrücknahme":"Wohnungsübergabe";
  return typLabel+(D.top?" Top "+D.top:"")+(objKurz()?" – "+objKurz():"")+" – "+fmtDate(D.datum);
}
function mailBody(){
  return "Sehr geehrte Damen und Herren,\n\n"+
    "anbei das Protokoll zur "+(istRuecknahme()?"Wohnungsrücknahme":"Wohnungsübergabe")+" am "+fmtDate(D.datum)+".\n\n"+
    "Objekt: "+(D.objekt||"-")+"\n"+
    (D.top?"Top: "+D.top+"\n":"")+
    (D.mieter?"Mieter/in: "+D.mieter+"\n":"")+
    "\nMit freundlichen Grüßen\n"+
    (D.verwalter?D.verwalter+"\n":"")+
    "PRISMA Zentrum für Standort- und Regionalentwicklung GmbH";
}
function sharePDF(){
  saveStep();if(typeof saveMangelStep==="function")saveMangelStep();
  var kern=[];
  if(!D.objekt)kern.push("Objekt");
  if(!D.datum)kern.push("Datum");
  if(!D.sig_v)kern.push("Unterschrift PRISMA");
  if(!D.sig_m)kern.push("Unterschrift Mieter/in");
  if(kern.length&&!confirm("Es fehlen noch: "+kern.join(", ")+".\n\nProtokoll trotzdem erstellen und senden?"))return;
  var sv=D.sig_v;
  var sm=D.sig_m;
  loading(true);
  sigToJpeg(sv,function(jv){sigToJpeg(sm,function(jm){
    var bytes;
    try{bytes=buildNativePDF(jv,jm);}catch(e){loading(false);toast("PDF-Erstellung fehlgeschlagen – bitte Druckweg nutzen",3000);return;}
    loading(false);
    var blob=new Blob([bytes],{type:"application/pdf"});
    var fname=pdfFileName();
    var file=null;
    try{file=new File([blob],fname,{type:"application/pdf"});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:mailSubject(),text:mailBody()}).catch(function(err){
        if(err&&err.name!=="AbortError")fallbackDownload(blob,fname);
      });
    }else{
      fallbackDownload(blob,fname);
    }
  });});
}
function copyEmail(){
  var t=D.email_mieter||"";if(!t)return;
  function done(ok){toast(ok?"E-Mail-Adresse kopiert":"Kopieren nicht möglich",1800);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(false);});
  }else{
    var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);done(ok);
  }
}
function fallbackDownload(blob,fname){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1500);
  toast("PDF wird heruntergeladen",2200);
}

// ── STEP-DISPATCH (Flags + Array) ──────────────────────────────────────────
step0.returnsHtml=true; step1.returnsHtml=true; step2.returnsHtml=true;
step3.returnsHtml=true; step4.returnsHtml=true; step5.returnsHtml=false;
// Reihenfolge: Daten, Schlüssel, Zähler, FOTOS, MÄNGEL, Abschluss
STEP_FNS=[step0,step1,step2,step4,step3,step5];

// ── ENTWÜRFE / ZWISCHENSPEICHERUNG (mehrere Protokolle) ────────────────────
var DRAFTS_KEY="prisma_drafts";       // Map: id -> {id,title,ts,data}
var CURRENT_KEY="prisma_current_id";  // zuletzt geladener Entwurf

function migrateData(d){
  // Sicherstellen, dass neue Felder existieren (alte Stände)
  if(!d.zaehler)d.zaehler=[];
  if(!d.datum)d.datum=todayISO();
  d.zaehler.forEach(function(z){if(!z.ablese)z.ablese=d.datum;if(z.einheit===undefined)z.einheit=(ZAE_EINHEIT[z._sel||z.art]||"");});
  if(d.iban===undefined)d.iban="";
  if(d.nachfolge===undefined)d.nachfolge="";
  if(!d.raeume)d.raeume=[];
  d.raeume.forEach(function(r){if(r._open===undefined)r._open=false;if(r.beschreibung===undefined)r.beschreibung="";});
  // Alt-Format: separate Mängel-Karten -> in Raum-Beschreibung übernehmen
  if(d.maengel&&d.maengel.length){
    d.maengel.forEach(function(m){
      var name=m._rsel||m.raum||"SONSTIGE";
      var r=null,i;
      for(i=0;i<d.raeume.length;i++){if(d.raeume[i].r===name){r=d.raeume[i];break;}}
      if(!r){for(i=0;i<d.raeume.length;i++){if(d.raeume[i].r==="SONSTIGE"){r=d.raeume[i];break;}}}
      if(!r)return;
      var t=(m.mangel||"").trim()+(m.bem?" ("+m.bem+")":"");
      if(t)r.beschreibung=(r.beschreibung?r.beschreibung+"\n":"")+t;
      if(m.foto)r.fotos.push({data:m.foto,bez:""});
      if(r.zustand!=="mittel"&&r.zustand!=="schlecht"){r.zustand="mittel";r.ok=true;}
    });
    d.maengel=[];
  }
  // v15: Zustandsmodell 2-stufig (gut | mangel) + Schweregrad je Raum
  d.raeume.forEach(function(r){
    if(r.zustand==="mittel"){r.zustand="mangel";if(!r.schwere)r.schwere="mittel";}
    else if(r.zustand==="schlecht"){r.zustand="mangel";if(!r.schwere)r.schwere="schwer";}
    if(r.schwere===undefined)r.schwere="";
  });
  if(d.sig_v_ts===undefined)d.sig_v_ts=null;
  if(d.sig_m_ts===undefined)d.sig_m_ts=null;
  return d;
}
function loadDrafts(){
  try{var s=localStorage.getItem(DRAFTS_KEY);return s?JSON.parse(s):{};}catch(e){return {};}
}
function saveDrafts(map){
  try{localStorage.setItem(DRAFTS_KEY,JSON.stringify(map));return true;}catch(e){toast("Speicher voll – evtl. Fotos reduzieren",3000);return false;}
}
function draftTitle(){
  var t=(D.objekt?D.objekt.split(",")[0]:"Ohne Objekt");
  if(D.top)t+=" / "+D.top;
  t+=" · "+(D.typ||"Übergabe");
  if(D.datum)t+=" · "+fmtDate(D.datum);
  return t;
}
function curId(){
  var id=null;try{id=localStorage.getItem(CURRENT_KEY);}catch(e){}
  if(!id){id="d"+Date.now()+"_"+Math.floor(Math.random()*1000);try{localStorage.setItem(CURRENT_KEY,id);}catch(e){}}
  return id;
}
function persist(){
  // Auto-Save in aktuellen Entwurf
  var map=loadDrafts();
  var id=curId();
  map[id]={id:id,title:draftTitle(),ts:Date.now(),data:D};
  saveDrafts(map);
}
function saveDraftManual(){
  persist();
  toast("Entwurf gespeichert ✓",1800);
}
function newDraft(){
  // aktuellen sichern, dann frisches Protokoll
  persist();
  try{localStorage.removeItem(CURRENT_KEY);}catch(e){}
  // D zurücksetzen
  D={
    typ:"Übergabe",datum:todayISO(),objekt:"",top:"",eigentuemer:"",mieter:"",
    email_mieter:"",telefon:"",kfz:"",verwalter:"",anbieter:"",
    strom_person:"Mieter",strom_bis:"",
    cb:[false,false,false],kaution_betrag:"",
    schluessel:[{art:"Wohnungsschlüssel",_sel:"Wohnungsschlüssel",anz:"",nr:"",foto:null}],
    zaehler:[
      {art:"Strom",_sel:"Strom",stand:"",nr:"",ablese:"",einheit:"kWh",foto:null},
      {art:"Wärme",_sel:"Wärme",stand:"",nr:"",ablese:"",einheit:"MWh",foto:null},
      {art:"Kaltwasser",_sel:"Kaltwasser",stand:"",nr:"",ablese:"",einheit:"m³",foto:null}
    ],
    maengel:[],
    iban:"",nachfolge:"",
    raeume:ROOMS.map(function(r){return{r:r,ok:false,zustand:"",schwere:"",beschreibung:"",fotos:[],_open:false};}),
    fotos:[],sig_v:null,sig_m:null,sig_v_ts:null,sig_m_ts:null,email_empf:""
  };
  D.zaehler.forEach(function(z){z.ablese=D.datum;});
  cur=0;visited={};
  curId(); // neue ID anlegen
  closeDraftPanel();
  render();
  toast("Neues Protokoll");
}
function loadDraft(id){
  var map=loadDrafts();
  if(!map[id]){toast("Entwurf nicht gefunden");return;}
  // aktuellen erst sichern
  persist();
  D=migrateData(JSON.parse(JSON.stringify(map[id].data)));
  try{localStorage.setItem(CURRENT_KEY,id);}catch(e){}
  cur=0;visited={};
  closeDraftPanel();
  render();
  toast("Entwurf geladen");
}
function deleteDraft(id,ev){
  if(ev)ev.stopPropagation();
  var map=loadDrafts();
  delete map[id];
  saveDrafts(map);
  var c=null;try{c=localStorage.getItem(CURRENT_KEY);}catch(e){}
  if(c===id){try{localStorage.removeItem(CURRENT_KEY);}catch(e){}}
  openDraftPanel(); // neu rendern
  toast("Entwurf gelöscht");
}
function openDraftPanel(){
  persist(); // aktuellen Stand sichern, damit er in der Liste erscheint
  var map=loadDrafts();
  var ids=Object.keys(map).sort(function(a,b){return map[b].ts-map[a].ts;});
  var curIdv=null;try{curIdv=localStorage.getItem(CURRENT_KEY);}catch(e){}
  var old=ge("draft-ov");if(old)old.parentNode.removeChild(old);
  var ov=document.createElement("div");
  ov.id="draft-ov";
  ov.style.cssText="position:fixed;inset:0;z-index:1600;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center";
  var list=ids.length
    ? ids.map(function(id){
        var d=map[id];
        var isCur=(id===curIdv);
        return '<div onclick="loadDraft(\''+id+'\')" style="display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:7px;border:1px solid '+(isCur?"#eb5b36":"#e0e0e0")+';border-radius:8px;cursor:pointer;background:'+(isCur?"#fff8f6":"#fff")+'">'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:13.5px;font-weight:700;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(d.title)+(isCur?' <span style="color:#eb5b36;font-size:11px">• aktuell</span>':'')+'</div>'+
            '<div style="font-size:11px;color:#999;margin-top:2px">zuletzt: '+new Date(d.ts).toLocaleString("de-AT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})+'</div>'+
          '</div>'+
          '<button onclick="deleteDraft(\''+id+'\',event)" type="button" style="flex-shrink:0;background:none;border:1px solid #e0e0e0;color:#c00;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:13px">✕</button>'+
        '</div>';
      }).join("")
    : '<div style="text-align:center;color:#aaa;font-size:13px;padding:24px 0">Noch keine gespeicherten Entwürfe.</div>';
  ov.innerHTML='<div style="background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 18px 26px;max-height:80vh;overflow-y:auto">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<div style="font-size:15px;font-weight:700">Gespeicherte Protokolle</div>'+
      '<button onclick="newDraft()" type="button" style="background:#eb5b36;color:#fff;border:none;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">＋ Neu</button>'+
    '</div>'+
    list+
    '<button onclick="closeDraftPanel()" type="button" style="display:block;width:100%;padding:13px;margin-top:8px;border:none;background:#f0f0f0;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:700">Schließen</button>'+
  '</div>';
  ov.onclick=function(e){if(e.target===ov)closeDraftPanel();};
  document.body.appendChild(ov);
}
function closeDraftPanel(){var ov=ge("draft-ov");if(ov)ov.parentNode.removeChild(ov);}

// ── RESTORE beim Start: aktuellen Entwurf laden, sonst Altformat migrieren ──
(function(){
  try{
    var curIdv=localStorage.getItem(CURRENT_KEY);
    var map=loadDrafts();
    if(curIdv&&map[curIdv]&&map[curIdv].data){
      D=migrateData(JSON.parse(JSON.stringify(map[curIdv].data)));
      toast("Letzter Entwurf wiederhergestellt",2200);
      return;
    }
    // Fallback: altes Einzelformat (prisma_proto) migrieren
    var saved=localStorage.getItem("prisma_proto");
    if(saved){
      var parsed=JSON.parse(saved);
      if(parsed&&(parsed.objekt||parsed.mieter)){
        D=migrateData(parsed);
        toast("Letzter Stand wiederhergestellt",2200);
      }
    }
  }catch(e){}
})();

loadObjekte();
render();
