║  entwickelt von Jakob Bonomo auf Grundlage seiner Erfahrung aus der Praxis, ║
║  mit dem Ziel, Übergabe-Abläufe produktiver und besser zu gestalten.        ║
║  Single-File HTML-PWA, läuft komplett im Browser, kein Backend.             ║
║                                                                              ║
║  PROTOKOLLARTEN (je Übergabe / Rücknahme)                                    ║
║  • Wohnung und Gewerbe: 6-Schritt-Wizard                                     ║
║    (Daten · Schlüssel · Zähler · Fotos · Mängel · Abschluss)                ║
║  • Schlüssel und Parkkarte: Einseiten-Formular, PDF strikt 1 Seite          ║
║                                                                              ║
║  KERNFUNKTIONEN                                                              ║
║  • Startbildschirm: Art-Kacheln + Richtung, Entwürfe separat (Header)       ║
║  • Objekt-/Mitarbeiter-/Anbieter-Suche (tippen = filtern)                   ║
║  • Mängel: Wischgesten (links löschen, rechts umbenennen), freie Räume,     ║
║    Schweregrade, Fotopflicht-Hinweise                                        ║
║  • Unterschriften im Vollbild (rotationsfest, Zusammenfassung eingeblendet) ║
║  • Natives PDF ohne Fremdbibliotheken, Auto-Fit Seite 1, Beilagen           ║
║  • Entwürfe in IndexedDB (Fotos ohne 5-MB-Limit), Falldaten in localStorage               ║
║  • Senden-Helfer (E-Mail/Betreff kopieren) + navigator.share mit PDF        ║
║                                                                              ║
║  EINSATZ: iPhone Safari vor Ort; Hosting GitHub Pages (PWA, sw.js-Cache).   ║

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRISMA Übergabeprotokoll</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eb5b36">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Übergabe">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* === RESET === */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:15px;background:#ededed;color:#1a1a1a;min-height:100vh;-webkit-overflow-scrolling:touch;overflow-y:auto;overflow-x:hidden}
/* v2.1 (#6): Doppeltipp-Zoom unterbinden, Pinch-Zoom bleibt */
button,a,label,input,select,textarea,.start-tile{touch-action:manipulation}
.sticky-top,.sticky-top *{touch-action:manipulation} /* v2.4 (#1): Kopfleiste zoomte als einziger Bereich noch bei Doppeltipp */
/* v2.1 (#3): Press-Feedback für Start-Kacheln */
.start-tile{transition:transform .1s ease,filter .1s ease}
.start-tile:active{transform:scale(.97);filter:brightness(.95)}
/* PWA safe-area (iPhone Notch) */
.sticky-top{padding-top:env(safe-area-inset-top)}
@supports(padding:env(safe-area-inset-top)){.header{padding-top:calc(14px + env(safe-area-inset-top))}}

/* === LAYOUT === */
.app{max-width:880px;margin:0 auto;padding:0 0 60px}
.sticky-top{position:sticky;top:0;z-index:50;will-change:transform;-webkit-transform:translateZ(0)}

/* === HEADER === */
.header{background:#fff;padding:14px 22px 11px;border-bottom:3px solid #eb5b36;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.07);overflow:hidden}
.header-left{min-width:0}
.header-left .app-title{font-size:16px;font-weight:700;color:#1a1a1a;line-height:1.2;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-left .app-sub{font-size:11px;color:#999;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header-logo{flex-shrink:0}
#hdr-btn{flex-shrink:0}
@media(max-width:480px){
  .header{padding:10px 14px 9px}
  .header-left .app-title{font-size:14px}
}

/* === PROGRESS === */
.progress-bar{height:3px;background:#e0e0e0}
.progress-fill{height:3px;background:#eb5b36;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* === STEP TABS === */
.steps{display:flex;background:#fff;border-bottom:1px solid #e8e8e8;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-tab{flex:1;min-width:0;padding:8px 2px 7px;text-align:center;font-size:10.5px;color:#b5b5b5;cursor:pointer;border-right:1px solid #f0f0f0;user-select:none;font-weight:600;transition:color .15s,background .15s;position:relative;-webkit-tap-highlight-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-tab:last-child{border-right:none}
.step-tab .sn{font-size:9px;font-weight:600;display:block;line-height:1.1;margin-bottom:1px;color:inherit;opacity:.75}
.step-tab.active{color:#eb5b36;background:#fff8f6;flex:1.5;font-size:13.5px;font-weight:800;letter-spacing:.2px}
.step-tab.active .sn{font-weight:700;opacity:.85}
.step-tab.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:#eb5b36}
.step-tab.done{color:#8a8a8a;background:#fafafa}
.zust-mini-row{display:flex;gap:5px;flex-shrink:0}
.zust-mini{width:38px;height:38px;border:none;background:none;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;border-radius:50%}
.zust-mini.on{background:#f5f5f5}
@media(max-width:500px){.step-tab{font-size:9.5px;padding:7px 1px 6px}.step-tab.active{font-size:12.5px}.step-tab .sn{font-size:8.5px}}

/* === CONTENT === */
.content-area{background:#fff;border:1px solid #e0e0e0;border-top:none;padding:26px 26px 22px;min-height:420px}
@media(max-width:600px){.content-area{padding:18px 15px 18px}}

/* === SECTION HEADERS === */
.sec-hd{font-size:10.5px;font-weight:700;color:#eb5b36;letter-spacing:1.2px;text-transform:uppercase;margin:22px 2px 9px}
.sec-hd:first-child{margin-top:0}

/* === OBJ BOX === */
.obj-box,.grp-card{border:1px solid #ececec;padding:16px 17px;margin-bottom:8px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.obj-row{display:flex;align-items:center;margin-bottom:11px;gap:10px}
.obj-row:last-child{margin-bottom:0}
.obj-lbl{font-weight:700;font-size:10.5px;color:#888;letter-spacing:.5px;text-transform:uppercase;min-width:175px;flex-shrink:0}
.obj-val{flex:1}
.obj-val input{width:100%;border:none;border-bottom:1.5px solid #d0d0d0;font-size:16px;font-family:inherit;color:#1a1a1a;background:transparent;padding:4px 3px 3px;outline:none;-webkit-appearance:none;transition:border-color .15s}
.obj-val input:focus{border-bottom-color:#eb5b36}
@media(max-width:520px){
  .obj-row{flex-direction:column;align-items:flex-start;gap:3px}
  .obj-lbl{min-width:unset}
  .obj-val{width:100%}
}

/* === FIELD ROW === */
.field-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.field-row .field{min-width:145px}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.field-full{flex-basis:100%}
.field label{font-size:11.5px;font-weight:700;color:#777;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field input,.field select{border:none;border-bottom:1.5px solid #d0d0d0;padding:6px 3px 4px;font-size:16px;font-family:inherit;color:#1a1a1a;background:transparent;outline:none;-webkit-appearance:none;border-radius:0;transition:border-color .15s}
.field-row-aligned .field input,.field-row-aligned .field select{height:34px;line-height:22px;box-sizing:border-box}
.field input:focus,.field select:focus{border-bottom-color:#eb5b36}

/* === CHECKBOXES === */
.cb-group{margin-bottom:18px}
.cb-row{display:flex;align-items:flex-start;gap:11px;font-size:14px;line-height:1.5;cursor:pointer;padding:10px 12px;border:1px solid #ebebeb;margin-bottom:7px;background:#fff;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.cb-row:hover{background:#fdf8f7;border-color:#f0c8be}
.cb-row input[type=checkbox]{width:19px;height:19px;min-width:19px;margin-top:2px;cursor:pointer;accent-color:#eb5b36;flex-shrink:0}
.cb-row.checked{background:#fff8f6;border-color:#f0c8be}

/* === TABLES === */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;border:1px solid #e0e0e0}
.tbl-scroll table{margin-bottom:0;min-width:500px;width:100%;border-collapse:collapse}
table.tbl th{padding:9px 11px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8;white-space:nowrap}
table.tbl td{padding:8px 9px;font-size:13.5px;vertical-align:middle;border-bottom:1px solid #ebebeb}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:#fafafa}
table.tbl input,table.tbl select{border:none;width:100%;font-size:16px;background:transparent;color:#1a1a1a;outline:none;font-family:inherit;padding:3px 2px}

/* === MANGEL TABLE === */
table.mg-tbl th{padding:9px 11px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8}
table.mg-tbl td{padding:8px 9px;font-size:13px;vertical-align:middle;border-bottom:1px solid #ebebeb}
table.mg-tbl tr:last-child td{border-bottom:none}
table.mg-tbl input,table.mg-tbl select{border:none;width:100%;font-size:16px;background:transparent;color:#1a1a1a;outline:none;font-family:inherit;padding:2px}

/* === CHECKLISTE === */
.cl-tbl{width:100%;border-collapse:collapse;margin-bottom:16px}
.cl-tbl th{padding:9px 12px;font-size:11.5px;font-weight:700;text-align:left;background:#f5f5f5;color:#444;border-bottom:2px solid #d8d8d8}
.cl-tbl td{padding:9px 12px;font-size:13px;vertical-align:top;border-bottom:1px solid #ebebeb}
.cl-tbl td:first-child{font-weight:700;font-size:12px;width:120px;color:#333}
.cl-tbl td:last-child{width:60px;text-align:center}
.cl-tbl tr.checked-row td{background:#f9fff6}
.cl-tbl input[type=checkbox]{width:22px;height:22px;accent-color:#2a9d3b;cursor:pointer}

/* === SCHLÜSSEL ROW === */
.sk-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid #f0f0f0}
.sk-anz{width:52px;border:none;border-bottom:1.5px solid #d0d0d0;text-align:center;font-size:16px;font-family:inherit;background:transparent;outline:none;padding:4px 2px;-webkit-appearance:none}
.sk-lbl{font-size:13px;color:#777;white-space:nowrap}
.sk-sel,.sk-inp{border:none;border-bottom:1.5px solid #d0d0d0;font-size:16px;font-family:inherit;background:transparent;outline:none;padding:4px 3px;-webkit-appearance:none;border-radius:0}
.sk-sel{min-width:155px}
.sk-inp{flex:1;min-width:80px}

/* === BUTTONS === */
.btn-add{background:#fff;color:#333;border:1.5px solid #888;padding:9px 17px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;border-radius:9px;transition:background .12s,border-color .12s;display:inline-flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent;margin-bottom:12px}
.btn-add:hover{background:#f5f5f5;border-color:#333}
.btn-del{background:transparent;color:#ccc;border:1px solid #e0e0e0;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:color .15s,border-color .15s,background .15s;min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.btn-del:hover{color:#cc3b3b;border-color:#cc3b3b;background:#fff0f0}

/* === FOTO === */
.foto-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #ccc;padding:5px 11px;font-size:11.5px;cursor:pointer;color:#666;font-family:inherit;transition:border-color .12s,color .12s;min-height:34px;-webkit-tap-highlight-color:transparent}
.foto-btn:hover{border-color:#555;color:#333}
.foto-thumb-wrap{position:relative;display:inline-block}
.foto-thumb{width:60px;height:60px;object-fit:cover;border:1px solid #ddd;display:block}
.foto-del-btn{position:absolute;top:-7px;right:-7px;background:#d00;color:#fff;border:none;width:18px;height:18px;font-size:9px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.foto-zone{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:5px}

/* === FOTO GRID === */
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:16px}
@media(max-width:480px){.foto-grid{grid-template-columns:repeat(2,1fr)}}
.foto-card{border:1px solid #e0e0e0;overflow:hidden;background:#fafafa}
.foto-card img{width:100%;height:112px;object-fit:cover;display:block}
.foto-card-foot{padding:5px 7px;display:flex;gap:5px;align-items:center;border-top:1px solid #f0f0f0}
.foto-card-foot input{border:none;font-size:16px;width:100%;background:transparent;outline:none;font-family:inherit;color:#666}

/* === SIGNATUR === */
.sig-grid{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 20px}
.sig-col{flex:1;min-width:210px}
.sig-lbl{font-size:11.5px;font-weight:700;color:#444;margin-bottom:7px;letter-spacing:.2px}
.sig-wrap{border:1.5px dashed #ccc;border-radius:10px;background:#fbfbfb;position:relative;cursor:pointer;min-height:115px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.sig-wrap img{width:100%;height:115px;object-fit:contain;display:block}
.sig-hint{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#b5b5b5;pointer-events:none;user-select:none;letter-spacing:.3px}
.sig-clear{background:#fff;border:1px solid #ccc;padding:5px 13px;font-size:11.5px;cursor:pointer;color:#666;margin-top:5px;font-family:inherit;transition:border-color .12s}
.sig-clear:hover{border-color:#555;color:#333}

/* === NAVIGATION === */
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;border-top:1px solid #e8e8e8;margin-top:20px;gap:10px;flex-wrap:wrap}
.btn-back{background:#fff;border:1.5px solid #aaa;padding:11px 22px;font-size:14px;cursor:pointer;color:#333;font-family:inherit;font-weight:500;border-radius:9px;transition:border-color .12s;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-back:hover{border-color:#333}
.btn-fwd{background:#1a1a1a;color:#fff;border:none;padding:11px 24px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;border-radius:9px;transition:background .15s;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-fwd:hover{background:#333}
.btn-print{background:#eb5b36;color:#fff;border:none;padding:11px 22px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;min-height:46px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-print:hover{background:#d04a28}
.btn-email{background:#fff;color:#1a1a1a;border:1.5px solid #555;padding:11px 20px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;min-height:46px;-webkit-tap-highlight-color:transparent}
.btn-email:hover{background:#f5f5f5}
.nav-right{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:500px){
  .nav-bar{flex-direction:column-reverse;align-items:stretch}
  .btn-back,.btn-fwd,.btn-print,.btn-email{width:100%;text-align:center;justify-content:center}
  .nav-right{flex-direction:column;width:100%}
}

/* === HINTS & ALERTS === */
.hint{background:#fdf6f4;border:1px solid #f5d0c5;border-left:3px solid #eb5b36;padding:12px 15px;font-size:12.5px;color:#666;margin-bottom:15px;line-height:1.65}
.info-empty{text-align:center;padding:20px 0;font-size:13px;color:#bbb;border-bottom:1px solid #f0f0f0;margin-bottom:10px}
.warn-box{border-left:3px solid #eb5b36;background:#fdf6f4;padding:9px 13px;font-size:12.5px;margin-bottom:12px;color:#666}

/* === TOAST === */
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;font-size:11.5px;padding:7px 15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* === LOADING === */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:200;font-size:13px;color:#888;display:none}
.loading-overlay.active{display:flex}


/* === ZUSTAND BADGE === */
.zust-row{display:flex;gap:7px;margin:8px 0 4px;flex-wrap:wrap}
.zust-btn{border:1.5px solid #ddd;background:#fff;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;font-family:inherit;border-radius:2px;transition:all .12s;min-height:36px;-webkit-tap-highlight-color:transparent;letter-spacing:.3px}
.zust-btn:hover{border-color:#aaa}
.zust-btn.sel-gut{background:#e8f7ec;border-color:#4caf50;color:#1b7a2e}
.zust-btn.sel-mittel{background:#fff8e6;border-color:#f0a500;color:#8a5c00}
.zust-btn.sel-schlecht{background:#fdecea;border-color:#e53935;color:#b71c1c}

/* === RAUM-FOTO BLOCK (in Mängel) === */
.raum-block{border:1px solid #e8e8e8;margin-bottom:14px;background:#fff}
.raum-block-hd{display:flex;align-items:center;gap:10px;padding:12px 15px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.raum-block-hd .rb-name{font-weight:700;font-size:14px;flex:1}
.raum-block-hd .rb-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:2px}
.rb-badge.gut{background:#e8f7ec;color:#1b7a2e}
.rb-badge.mittel{background:#fff8e6;color:#8a5c00}
.rb-badge.schlecht{background:#fdecea;color:#b71c1c}
.rb-badge.none{background:#f0f0f0;color:#aaa}
.raum-block-hd .rb-toggle{font-size:13px;color:#aaa;margin-left:4px;transition:transform .2s}
.raum-block-hd.open .rb-toggle{transform:rotate(180deg)}
.raum-block-body{padding:14px 15px;display:none}
.raum-block-body.open{display:block}

/* === MANGEL CARD === */
.mangel-card{background:#fff8f6;border:1px solid #f5d0c5;padding:11px 13px;margin-bottom:9px;position:relative}
.mangel-card-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.mangel-card textarea{width:100%;border:none;border-bottom:1.5px solid #e0d0d0;font-size:16px;font-family:inherit;background:transparent;outline:none;padding:3px 2px;resize:none;min-height:38px}
.mangel-card textarea:focus{border-bottom-color:#eb5b36}

/* === FOTO GRID (Raum-Fotos) === */
.rfoto-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;align-items:flex-start}
.rfoto-item{position:relative;width:80px}
.rfoto-img{width:80px;height:80px;object-fit:cover;display:block;border:1px solid #e0e0e0}
.rfoto-del{position:absolute;top:-6px;right:-6px;background:#c00;color:#fff;border:none;width:20px;height:20px;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rfoto-lbl{font-size:10px;color:#888;width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rfoto-add{width:80px;height:80px;border:2px dashed #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;font-size:11px;color:#bbb;gap:4px;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
.rfoto-add:hover,.rfoto-add:active{border-color:#eb5b36;background:#fff8f6;color:#eb5b36}
.rfoto-add span{font-size:22px;line-height:1}

/* === DOWNLOAD BUTTON === */
.btn-dl{background:#2e7d32;color:#fff;border:none;padding:11px 22px;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;min-height:46px;transition:background .15s;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;gap:7px}
.btn-dl:hover{background:#1b5e20}

// ── IMAGE RESIZE ───────────────────────────────────────────────────────────
function resizeImg(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=900,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX&&h>w){w=Math.round(w*MAX/h);h=MAX;}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.72));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
// v2.0 (#27): Foto speichern, bei vollem Gerätespeicher zurückrollen + verständlicher Hinweis
function fotoPersistOderRollback(rollbackFn){
  if(!persist()){
    if(typeof rollbackFn==="function")rollbackFn();
    persist();
    toast("Speichern nicht möglich. Bitte App neu laden und erneut versuchen.",4200);
    render();
    return false;
  }
  return true;
}

  el=ge("f_mv_ende");if(el)D.mv_ende=el.value;
  el=ge("f_sk_fehlen");if(el)D.sk_fehlen=el.value;

      if(se){D.schluessel[i]._sel=se.value;D.schluessel[i].art=(se.value==="Sonstiger Schlüssel"&&ce&&ce.value)?ce.value:se.value;}
      if(fe){D.schluessel[i].art=fe.value;D.schluessel[i]._sel=fe.value;}
    }
  }
  if(cur===2){
    for(i=0;i<D.zaehler.length;i++){
      var zse=ge("zae_sel_"+i),zne=ge("zae_nr_"+i),zst=ge("zae_st_"+i),zab=ge("zae_ab_"+i),zeh=ge("zae_eh_"+i),zce=ge("zae_cust_"+i);
      if(zne)D.zaehler[i].nr=zne.value;
      if(zst)D.zaehler[i].stand=zst.value;
      if(zab)D.zaehler[i].ablese=zab.value;
      if(zeh)D.zaehler[i].einheit=zeh.value;
      if(zse){D.zaehler[i]._sel=zse.value;D.zaehler[i].art=(zse.value==="Sonstiger Zähler"&&zce&&zce.value)?zce.value:zse.value;}
    }
  }
  // cur===3 = Fotos: saves inline
  if(cur===4){saveMangelStep();}
  if(cur===5){

function goStep(n){
  if(n===cur)return;
  saveStep();
  visited[cur]=true; // mark current step as visited before leaving
  persist(); // Auto-Save in aktuellen Entwurf
  cur=n;render();scrollTop();
}

// ── SCHRITT-VOLLSTÄNDIGKEIT (für Haken + "Was fehlt noch?") ────────────────
// Gibt true zurück, wenn der Schritt echten Inhalt hat (nicht nur besucht wurde).
function stepHasContent(i){
  if(i===0) return !!(D.objekt||D.mieter||D.eigentuemer);
  if(i===1) return D.schluessel.some(function(s){return s.anz;});
  if(i===2) return D.zaehler.some(function(z){return z.stand||z.nr;});
  if(i===3) return D.fotos.length>0;
  if(i===4) return D.raeume.some(function(r){return r.zustand||(r.beschreibung&&r.beschreibung.trim())||(r.fotos&&r.fotos.length);});
  if(i===5) return !!(D.sig_v||D.sig_m);
  return false;
}

  f.forEach(function(id){var el=ge(id);if(el)D[map[id]]=el.value;});

  D.schluessel.forEach(function(s,i){
    var se=ge("sk_sel_"+i),ae=ge("sk_anz_"+i),ne=ge("sk_nr_"+i),ce=ge("sk_cust_"+i),fe=ge("sk_free_"+i);
    if(se){s._sel=se.value;s.art=(se.value==="Sonstiger Schlüssel"&&ce)?ce.value:se.value;}

}

var _rbSwipe={i:-1,x0:0,y0:0,dx:0,open:-1,dir:0,drag:false};
function rbOffen(i,richtung){
  // richtung: -1 = Löschen (links gewischt), +1 = Umbenennen (rechts gewischt), 0 = zu
  var el=ge("rbhd_"+i);if(!el)return;
  el.style.transform=richtung?("translateX("+(richtung*86)+"px)"):"translateX(0)";
  if(richtung){_rbSwipe.open=i;_rbSwipe.dir=richtung;}
  else if(_rbSwipe.open===i){_rbSwipe.open=-1;_rbSwipe.dir=0;}
}
function rbTS(i,ev){
  var t=ev.touches[0];
  _rbSwipe.i=i;_rbSwipe.x0=t.clientX;_rbSwipe.y0=t.clientY;_rbSwipe.dx=0;_rbSwipe.drag=false;
  if(_rbSwipe.open>=0&&_rbSwipe.open!==i)rbOffen(_rbSwipe.open,0);
}
function rbTM(i,ev){
  var t=ev.touches[0];
  var dx=t.clientX-_rbSwipe.x0,dy=t.clientY-_rbSwipe.y0;
  if(!_rbSwipe.drag){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)_rbSwipe.drag=true;else return;
  }
  ev.preventDefault();
  _rbSwipe.dx=dx;
  var base=(_rbSwipe.open===i?_rbSwipe.dir*86:0);

function rotFoto(i){
  var f=D.fotos[i];if(!f||!f.data)return;
  var im=new Image();
  im.onload=function(){
    var c=document.createElement("canvas");
    c.width=im.height;c.height=im.width;
    var x=c.getContext("2d");
    x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);
    x.drawImage(im,-im.width/2,-im.height/2);
    f.data=c.toDataURL("image/jpeg",0.8);
    persist();render();
  };
  im.src=f.data;
}

var OBJ_KUERZEL={
  "STADTWERK, Hochhaus, Strubergasse 26, 5020 Salzburg":"STG26",
  "STADTWERK, Strubergasse 18, 5020 Salzburg":"STG18",
  "STADTWERK West, Rosseggerstraße 4, 5020 Salzburg":"ROS4",

function objKuerzel(){
  var name=(D.objekt||"").trim();
  if(OBJ_KUERZEL[name])return OBJ_KUERZEL[name];
  // Auto: erste 3 Buchstaben des Straßennamens + Hausnummer (PLZ-Segmente ignorieren)
  var segs=name.split(",");
  for(var i=0;i<segs.length;i++){
    var s=segs[i].trim();
    if(/^\d{4,5}\s/.test(s))continue; // PLZ+Ort
    var m=s.match(/([A-Za-zÄÖÜäöüß]+)[^\d]*?(\d+)\s*[a-zA-Z]?\s*$/);
    if(m){
      var st=m[1].replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss");
      return (st.substring(0,3).toUpperCase())+m[2];
    }
  }
  return "";
}

function updateSigHint(wrapId){
  var w=ge(wrapId);if(w){var h=w.querySelector(".sig-hint");if(h)h.style.display="none";}
}

function initPad(canvasId,wrapId){
  var cv=ge(canvasId),ctx=cv.getContext("2d"),drawing=false,last=null,hasDrawn=false;
  function pos(e){var r=cv.getBoundingClientRect(),src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(cv.width/r.width),y:(src.clientY-r.top)*(cv.height/r.height)};}
  var lw=4*(cv.width/Math.max(1,cv.getBoundingClientRect().width||cv.width)); // kräftiger Strich, auch auf Retina
  function draw(p){ctx.strokeStyle="#111";ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
  function hint(){if(wrapId)updateSigHint(wrapId);else if(typeof sigOvHint==="function")sigOvHint(false);}
  cv.addEventListener("mousedown",function(e){drawing=true;last=pos(e);hasDrawn=true;hint();});
  cv.addEventListener("mousemove",function(e){if(drawing)draw(pos(e));});
  cv.addEventListener("mouseup",function(){drawing=false;});
  cv.addEventListener("mouseleave",function(){drawing=false;});
  cv.addEventListener("touchstart",function(e){
    e.preventDefault();
    cv.style.touchAction="none";
    drawing=true;last=pos(e);hasDrawn=true;hint();
  },{passive:false});
  cv.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(drawing)draw(pos(e));
  },{passive:false});
  cv.addEventListener("touchend",function(){
    drawing=false;
    cv.style.touchAction="auto";
  });
  cv.addEventListener("touchcancel",function(){
    drawing=false;
    cv.style.touchAction="auto";
  });
  return{
    cv:cv,ctx:ctx,
    toDataURL:function(){return cv.toDataURL("image/png");},
    markDrawn:function(){hasDrawn=true;},
    reset:function(){hasDrawn=false;},
    isEmpty:function(){if(!hasDrawn)return true;var d=ctx.getImageData(0,0,cv.width,cv.height).data;for(var i=3;i<d.length;i+=4){if(d[i]>10)return false;}return true;}
  };
}

function sigSummary(){
  // Kernfakten, die der/die Unterzeichnende bestätigt (v20)
  var t=[];
  if(D.objekt)t.push("<b>"+esc(D.objekt.split(",")[0])+(D.top?" · Top "+esc(D.top):"")+"</b>");
  if(D.mieter)t.push(esc(D.mieter)+(D.mieter_vd?", vertr. d. "+esc(D.mieter_vd):""));
  if(!istEinseiter()){
    var mg=D.raeume.filter(function(r){return r.zustand==="mangel";}).length;
    t.push(mg?mg+" Mangel/Mängel erfasst":"keine Mängel erfasst");
    var sk=D.schluessel.filter(function(s){return s.anz;}).map(function(s){return s.anz+"× "+(s.art||"Schlüssel");});
    if(sk.length)t.push(sk.join(", "));
    var za=D.zaehler.filter(function(z){return z.stand;}).map(function(z){return (z.art||"Zähler")+" "+z.stand+(z.einheit?" "+z.einheit:"");});
    if(za.length)t.push(za.join(", "));
  }else if(D.art==="schluessel"){
    var sk2=D.schluessel.filter(function(s){return s.anz;}).map(function(s){return s.anz+"× "+(s.art||"Schlüssel");});
    t.push(sk2.length?sk2.join(", "):"keine Schlüssel erfasst");
  }else{
    var ka=D.karten.filter(function(k){return k.nr;});
    t.push(ka.length?ka.length+" Parkkarte(n): Nr. "+ka.map(function(k){return k.nr;}).join(", "):"keine Karten erfasst");
  }
  return t.join(" · ");
}

    c.width=Math.round(r2.width*dpr2);c.height=Math.round(r2.height*dpr2);

var sigOvRelayout=null;
function sigOvHint(show){var hn=ge("sig-ov-hint");if(hn)hn.style.display=show?"flex":"none";}

function sigCrop(cv){
  // Bounding-Box der Tinte ermitteln und mit Rand ausschneiden
  var ctx=cv.getContext("2d");
  var w=cv.width,hgt=cv.height,data=ctx.getImageData(0,0,w,hgt).data;
  var minX=w,minY=hgt,maxX=-1,maxY=-1;
  for(var y=0;y<hgt;y++){
    for(var x=0;x<w;x++){
      if(data[(y*w+x)*4+3]>10){
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return null; // leer
  var pad=Math.round(Math.max(maxX-minX,maxY-minY)*0.06)+8;
  minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad);maxY=Math.min(hgt-1,maxY+pad);
  var cw=maxX-minX+1,ch=maxY-minY+1;
  var out=document.createElement("canvas");out.width=cw;out.height=ch;
  out.getContext("2d").drawImage(cv,minX,minY,cw,ch,0,0,cw,ch);
  return out.toDataURL("image/png");
}
function sigOvSave(){

  if(sigWhich==="v"){D.sig_v=d;D.sig_v_ts=ts;}else{D.sig_m=d;D.sig_m_ts=ts;}
  persist();closeSigOverlay();render();
}

// HTML-Version des Protokolls (für Vorschau / Drucken) – Layout wie das Senden-PDF
function buildPDF(){
  saveStep();
  if(typeof saveMangelStep==="function")saveMangelStep();
  var sv=D.sig_v;
  var sm=D.sig_m;
  var title=protTitle();

  var lg='<img src="'+LOGO_PNG_DATA+'" alt="PRISMA" style="height:17px;width:auto">';
  var css='*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#000;background:#fff}'+
    '.pg,.bl{padding:15mm 20mm 20mm;min-height:290mm;display:flex;flex-direction:column;position:relative}'+
    '.bl{page-break-before:always}'+
    '.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:3mm;border-bottom:1pt solid #8c8c8c;margin-bottom:8mm}'+

    '.obj{border:.6pt solid #666;padding:9px 12px}'+
    '.or{display:flex;font-size:10pt;line-height:1.6;margin:2px 0}.ol{font-weight:700;min-width:150px;color:#333}'+
    '.txt{font-size:10pt;line-height:1.55;margin:4px 0}.ind{margin-left:8px}'+
    '.cbl{display:flex;gap:8px;font-size:10pt;margin:6px 0;align-items:baseline}.cbx{font-size:12pt;line-height:1}'+
    '.shd{background:#eee;font-weight:700;font-size:9.5pt;padding:3px 8px;margin:13px 0 8px;color:#222}'+
    '.zrow{display:flex;gap:0;font-size:10pt;margin:5px 0 5px 8px}.zrow b{width:95px}.zrow span{width:145px}'+
    '.sig-area{margin-top:auto;padding-top:12mm}'+
    '.best{font-size:10.5pt;font-weight:700;line-height:1.5}'+
    '.sgrid{display:flex;gap:24px}.scol{flex:1}'+
    '.simg{height:62px;display:block;max-width:96%;object-fit:contain;object-position:left bottom}'+
    '.sline{border-bottom:.8pt solid #000;margin-top:4px}'+

    '.srole{font-size:7pt;font-weight:700;letter-spacing:.5pt;text-transform:uppercase;color:#777;margin-bottom:2px}'+
    '.beil{margin-top:14px;font-size:9pt;color:#666;line-height:1.7}'+

    '.fbox img{max-width:100%;max-height:100%;object-fit:contain}'+
    '.fcap{font-size:8.5pt;color:#555;margin-top:2mm}'+
    '.secfoot{position:absolute;bottom:7mm;left:20mm;right:20mm;display:flex;justify-content:space-between;font-size:8pt;color:#999;border-top:.5pt solid #ccc;padding-top:3px}'+
    '@page{margin:0;size:A4}'+
    '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}';
  function lgK(){return lg;}
  function ortAusObjekt(){
    var m=(D.objekt||"").match(/\b\d{4,5}\s+([A-Za-zÄÖÜäöüß.\- ]+?)\s*$/);
    return m?m[1].trim()+", ":"";
  }
  function docShell(t,body){
    return '<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>'+t+'</title><style>'+css+'</style></head><body>'+body+'</body></html>';
  }
  if(istEinseiter()){
    var dK=fmtDate(D.datum),tK=protTitle();
    var wer=(esc(D.mieter)||"der Mieter")+(D.mieter_vd?", vertreten durch "+esc(D.mieter_vd)+",":"");

    if(D.art==="schluessel"){
      var skf=D.schluessel.filter(function(s){return s.anz;});
      liste='<div class="shd">Schlüssel</div>'+(skf.length?skf.map(function(s){return '<p class="txt">'+esc(s.anz)+' Stk. '+esc(s.art||"Schlüssel")+(s.nr?' &middot; Nr. '+esc(s.nr):'')+'</p>';}).join(""):'<p class="txt dim">-</p>')+
        '<p class="txt" style="font-size:9pt;color:#444;margin-top:5mm">Bei Verlust eines Schlüssels muss aus Sicherheitsgründen die gesamte Schließanlage auf Kosten des Mieters ausgetauscht werden.</p>';
    }else{

        (istRuecknahme()?'':'<p class="txt" style="font-size:9pt;color:#444;margin-top:5mm">Bei Verlust einer Parkkarte wird ein Kostenersatz von EUR '+esc(D.verlust_eur||"15")+',&ndash; verrechnet.</p>');

    var rowsK='<div class="or"><span class="ol">Objekt:</span><b>'+esc(D.objekt||"-")+'</b></div>'+
      (D.top?'<div class="or"><span class="ol">Top:</span><b>'+esc(D.top)+'</b></div>':'')+
      (D.eigentuemer?'<div class="or"><span class="ol">Eigentümer/Vermieter:</span>'+esc(D.eigentuemer)+'</div>':'')+
      '<div class="or"><span class="ol">Mieter/in:</span><b>'+esc(D.mieter||"-")+'</b></div>'+
      (D.mieter_vd?'<div class="or"><span class="ol">vertreten durch:</span>'+esc(D.mieter_vd)+'</div>':'')+
      (D.art==="parkkarte"&&D.kfz?'<div class="or"><span class="ol">KFZ-Kennzeichen:</span>'+esc(D.kfz)+'</div>':'');
    var sv=D.sig_v,sm=D.sig_m;
    var kurz='<div class="pg">'+
      '<div class="hdr"><div><div class="dt">'+tK+'</div><div class="ds">'+esc(D.typ)+' &middot; '+dK+'</div></div>'+lgK()+'</div>'+
      '<div class="obj">'+rowsK+'</div>'+
      '<p class="txt" style="margin-top:6mm">Hiermit bestätigt '+wer+' die '+(istRuecknahme()?"Rückgabe":"Übernahme")+' der nachstehend angeführten '+(D.art==="schluessel"?"Schlüssel":"Parkkarten")+':</p>'+
      liste+
      '<div class="sig-area" style="margin-top:auto">'+
        '<p class="txt">'+ortAusObjekt()+'am '+dK+'</p>'+
        '<div class="srow">'+
        '<div class="scol">'+(sv?'<img src="'+sv+'" class="simg">':'<div class="simg"></div>')+'<div class="sline"></div><div class="slbl">'+sigLblVermieterHTML()+'</div></div>'+
          '<div class="scol">'+(sm?'<img src="'+sm+'" class="simg">':'<div class="simg"></div>')+'<div class="sline"></div><div class="slbl">'+sigLblMieterHTML()+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="secfoot"><span>'+tK+' - '+esc(objMitTop())+'</span><span>Seite 1 von 1</span></div>'+
    '</div>';

  // Objektbox-Zeilen
  var rows=[["Objekt:",D.objekt,1],["Top:",D.top,1],["Eigentümer/Vermieter:",D.eigentuemer,0],["Mieter/in:",D.mieter,1]];
  if(D.mieter_vd)rows.splice(4,0,["vertreten durch:",D.mieter_vd,0]);

  if(D.telefon)rows.push(["Telefon:",D.telefon,0]);
  if(D.kfz)rows.push(["KFZ-Kennzeichen:",D.kfz,0]);
  if(istRuecknahme()&&D.iban)rows.push(["IBAN Mieter/in:",D.iban,0]);
  if(istRuecknahme()&&D.nachfolge)rows.push(["Nachfolgeadresse:",D.nachfolge,0]);
  if(istRuecknahme()&&D.mv_ende)rows.push(["Mietvertragsende:",fmtDate(D.mv_ende),0]);
  var objH=rows.map(function(r){return '<div class="or"><span class="ol">'+r[0]+'</span>'+(r[2]?'<strong>':'')+esc(r[1]||"")+(r[2]?'</strong>':'')+'</div>';}).join("");

  var acb=autoCB();
  var cbH=CB_LABELS.map(function(l,i){
    if(i===2&&istRuecknahme())return"";
    if((i===0||i===1)&&!acb[i])return""; // v2.0: nur die zutreffende Mängel-Zeile drucken
    return'<div class="cbl"><span class="cbx">'+(acb[i]?"☑":"☐")+'</span><span>'+cbLabel(i)+'</span></div>';
  }).join("");
  if(D.art==="wohnung"&&istRuecknahme())cbH+='<div class="cbl"><span class="cbx">'+(D.nachsend?"☑":"☐")+'</span><span>der Post-Nachsendeauftrag an die neue Adresse wurde '+(D.nachsend?"eingerichtet":"nicht eingerichtet &ndash; Fristsetzung bis "+(D.nachsend_frist?fmtDate(D.nachsend_frist):"________"))+'</span></div>';
  if(D.ba&&!istRuecknahme())cbH+='<div class="cbl"><span class="cbx">☑</span><span>die Bedienungsanleitungen wurden '+(istRuecknahme()?"zurückgegeben":"übergeben")+(D.ba_art?" ("+esc(D.ba_art)+")":"")+'</span></div>';
  if(D.bs&&istGewerbe()&&!istRuecknahme())cbH+='<div class="cbl"><span class="cbx">☑</span><span>die Brandschutzordnung wurde übergeben</span></div>';

  var stromH=(D.anbieter||D.strom_bis)
    ? '<p class="txt">'+(istRuecknahme()?"Abmeldung":"Anmeldung")+' Stromliefervertrag beim Anbieter <b>'+esc(D.anbieter||"-")+'</b> wird erledigt durch '+esc(D.strom_person||"-")+(D.strom_bis?' mit Zählerstichtag (Smart Meter) <b>'+fmtDate(D.strom_bis)+'</b>':"")+'.</p>'

  var sk=D.schluessel.filter(function(s){return s.anz;});
  var skH=sk.length?'<div class="shd">Schlüssel</div>'+sk.map(function(s){return '<div class="txt ind">'+esc(s.anz)+' Stk. '+esc(s.art)+(s.nr?' &ensp;·&ensp; Nr. '+esc(s.nr):"")+'</div>';}).join(""):"";

  }).join(""):"";

  var rasterFotos=[];
  D.raeume.forEach(function(r){
    if(r.zustand==="mangel")return; // Fotos dieser Räume erscheinen in Beilage 1
    (r.fotos||[]).forEach(function(f){if(f&&f.data)rasterFotos.push({data:f.data,bez:f.bez||r.r});});
  });
  D.fotos.forEach(function(f){if(f&&f.data)rasterFotos.push({data:f.data,bez:f.bez||""});});
  var hatFotos=(rasterFotos.length+zaehlerFotos().length+schluesselFotos().length)>0;
  var beil=["Checkliste & Mängel/Schäden"];if(hatFotos)beil.push("Fotodokumentation");

  var best="Ich/Wir bestätige/n die ordnungsgemäße "+(istRuecknahme()?"Rückgabe":"Übernahme")+" der angeführten Einheit unter Berücksichtigung des Bestandvertrages. Die Einheit wurde mit Ausnahme der angeführten Mängel in einwandfreiem Zustand "+(istRuecknahme()?"zurückgegeben":"übernommen")+".";
  var ortM=(D.objekt||"").match(/\b\d{4,5}\s+([A-Za-zÄÖÜäöüß.\- ]+?)\s*$/);
  var ort=ortM?ortM[1].trim():"";

  function hdr(t){return '<div class="hdr"><div><div class="dt">'+t+'</div><div class="ds">'+sub+'</div></div>'+lg+'</div>';}

  var seite1='<div class="pg">'+hdr(title)+
    '<div class="obj">'+objH+'</div>'+
    '<p class="txt" style="margin-top:14px">Bei der '+typWort()+' der Mieteinheit'+(artConf().nebenfl?' samt Nebenflächen':'')+' am <b>'+datumStr+'</b> wurden:</p>'+cbH+
    stromH+skH+zH+
    '<div class="sig-area">'+
      '<p class="best">'+best+'</p>'+
      '<p class="txt" style="margin:14px 0 22px">'+(ort?esc(ort)+", ":"")+"am "+datumStr+'</p>'+
      '<div class="sgrid">'+
        '<div class="scol">'+(sv?'<img src="'+sv+'" class="simg">':'<div class="simg"></div>')+'<div class="sline"></div><div class="slbl">'+sigLblVermieterHTML()+'</div></div>'+
        '<div class="scol">'+(sm?'<img src="'+sm+'" class="simg">':'<div class="simg"></div>')+'<div class="sline"></div><div class="slbl">'+sigLblMieterHTML()+'</div></div>'+

var _acOpen=false;

function acFilter(val,inputEl){
  // Remove existing list
  var old=ge("ac-list");if(old&&old.parentNode)old.parentNode.removeChild(old);
  if(!val||val.length<1||!OBJEKTE.length){_acOpen=false;return;}
  var q=val.toLowerCase();
  var matches=OBJEKTE.filter(function(o){
    var n=(o.name||"").toLowerCase(),e=(o.eigentuemer||"").toLowerCase();
    return n.indexOf(q)>=0||e.indexOf(q)>=0;
  });
  if(!matches.length){_acOpen=false;return;}

  var list=document.createElement("div");
  list.id="ac-list";
  list.className="ac-list";
  matches.slice(0,8).forEach(function(o){
    var item=document.createElement("div");
    item.className="ac-item";
    // Highlight matching part
    var safe=q.replace(/[-.*+?^${}()|\[\]\\]/g,"\\$&");
    var hl=o.name.replace(new RegExp("("+safe+")","gi"),"<strong>$1</strong>");
    item.innerHTML=hl+(o.eigentuemer?'<small>'+esc(o.eigentuemer)+'</small>':'');
    item.onmousedown=item.ontouchstart=function(e){
      e.preventDefault();
      acSelect(o);
    };
    list.appendChild(item);
  });

  // Insert after input
  var wrap=inputEl.closest(".ac-wrap")||inputEl.parentNode;
  wrap.appendChild(list);
  _acOpen=true;
}

function acSelect(o){
  var elName=ge("f_objekt");
  var elOwner=ge("f_eigentuemer");
  if(elName){elName.value=o.name;D.objekt=o.name;}
  if(elOwner&&o.eigentuemer){elOwner.value=o.eigentuemer;D.eigentuemer=o.eigentuemer;}
  var old=ge("ac-list");if(old&&old.parentNode)old.parentNode.removeChild(old);

}

}

function burstShot(){
  var v=ge("burst-video");if(!v||!v.videoWidth)return;
  var MAX=900,w=v.videoWidth,h2=v.videoHeight;
  if(w>=h2&&w>MAX){h2=Math.round(h2*MAX/w);w=MAX;}
  else if(h2>w&&h2>MAX){w=Math.round(w*MAX/h2);h2=MAX;}
  // WYSIWYG: gespeichert wird exakt das Vorschaubild (keine Drehberechnung)
  var c=document.createElement("canvas");c.width=w;c.height=h2;
  c.getContext("2d").drawImage(v,0,0,w,h2);
  D.fotos.push({data:c.toDataURL("image/jpeg",0.72),bez:""});
  _burstN++;persist();
  var cnt=ge("burst-count");if(cnt)cnt.textContent=_burstN+" Foto"+(_burstN===1?"":"s");
  var fl=ge("burst-flash");if(fl){fl.style.opacity=".7";setTimeout(function(){fl.style.opacity="0";},110);}
}
function closeBurst(){
  if(_burstStream){_burstStream.getTracks().forEach(function(t){t.stop();});_burstStream=null;}
  var ov=ge("burst-ov");if(ov)ov.parentNode.removeChild(ov);
  render();
  if(_burstN>0)toast(_burstN+" Foto"+(_burstN===1?"":"s")+" übernommen",1800);
}

// Erzeugt ein echtes PDF (PDF 1.4, Helvetica/WinAnsi, JPEG-Bilder) rein clientseitig.
var APP_VERSION="2.4";

function jpegDim(bin){
  var i=2,L=bin.length;
  while(i<L-9){
    if(bin.charCodeAt(i)!==0xFF){i++;continue;}
    var m=bin.charCodeAt(i+1);
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){
      return{h:((bin.charCodeAt(i+5)<<8)|bin.charCodeAt(i+6)),w:((bin.charCodeAt(i+7)<<8)|bin.charCodeAt(i+8))};
    }
    i+=2+((bin.charCodeAt(i+2)<<8)|bin.charCodeAt(i+3));
  }
  return{w:400,h:300};
}
function pdfEnc(s){
  s=String(s==null?"":s);var o="";
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c===8364)c=128;               // €
    if(c===8211||c===8212)c=45;      // – —
    if(c===8216||c===8217)c=39;      // ' '
    if(c===8220||c===8221)c=34;      // " "
    if(c===8230){o+="...";continue;} // …
    if(c>255)c=63;                   // ?
    if(c===92||c===40||c===41)o+="\\"+String.fromCharCode(c);
    else if(c<32||c>126)o+="\\"+("00"+c.toString(8)).slice(-3);
    else o+=String.fromCharCode(c);
  }
  return o;
}
function twd(s,size,bold){
  s=String(s==null?"":s);var w=0;
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if("il.,:;'!|()[]jtfrI ".indexOf(ch)>=0)w+=0.31;
    else if("MWm@".indexOf(ch)>=0)w+=0.9;
    else if(ch>="A"&&ch<="Z")w+=0.7;
    else if(ch>="0"&&ch<="9")w+=0.58;
    else w+=0.55;
  }
  return w*size*(bold?1.06:1);
}
function twrap(s,size,bold,maxw){
  var words=String(s==null?"":s).split(/\s+/),lines=[],curl="";
  for(var i=0;i<words.length;i++){
    var t=curl?curl+" "+words[i]:words[i];
    if(twd(t,size,bold)<=maxw||!curl)curl=t;else{lines.push(curl);curl=words[i];}
  }
  if(curl)lines.push(curl);
  return lines.length?lines:[""];
}

function sigToJpeg(dataUrl,cb){

  var im=new Image();
  im.onload=function(){
    var c=document.createElement("canvas");c.width=im.width||400;c.height=im.height||115;
    var x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
    cb(c.toDataURL("image/jpeg",0.92));
  };
  im.onerror=function(){cb(null);};
  im.src=dataUrl;
}

function sharePDF(){
  if(istEinseiter())saveSingle();else{saveStep();if(typeof saveMangelStep==="function")saveMangelStep();}
  var kern=[];
  if(!D.objekt)kern.push("Objekt");
  if(!D.datum)kern.push("Datum");
  if(!D.verwalter)kern.push("durchführende Person (PRISMA)"); // #17: überspringbar nachfragen
  if(!D.sig_v)kern.push("Unterschrift PRISMA");
  if(!D.sig_m)kern.push("Unterschrift Mieter/in");
  var mob=D.raeume.filter(function(r){return r.zustand==="mangel"&&!(r.beschreibung&&r.beschreibung.trim());});
  if(mob.length)kern.push("Mangelbeschreibung ("+mob.map(function(r){return r.r;}).join(", ")+")");
  if(kern.length&&!confirm("Es fehlen noch: "+kern.join(", ")+".\n\nProtokoll trotzdem erstellen und senden?"))return;
  var sv=D.sig_v;
  var sm=D.sig_m;
  loading(true);
  sigToJpeg(sv,function(jv){sigToJpeg(sm,function(jm){
    var bytes;
    try{bytes=buildNativePDF(jv,jm);}catch(e){loading(false);toast("PDF-Erstellung fehlgeschlagen – bitte Druckweg nutzen",3000);return;}
    loading(false);
    // #26/#3: Entwurf zuverlässig als gesendet markieren (separate Gruppierung am Start)
    D._sent=true;D._sent_ts=todayISO();
    curId(); // sicherstellen, dass eine ID existiert
    persist();
    var blob=new Blob([bytes],{type:"application/pdf"});
    var fname=pdfFileName();
    var file=null;
    try{file=new File([blob],fname,{type:"application/pdf"});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:mailSubject(),text:mailBody()}).catch(function(err){
        if(err&&err.name!=="AbortError")fallbackDownload(blob,fname);
      });
    }else{
      fallbackDownload(blob,fname);
    }
  });});
}
function copyEmail(){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(false);});
  }else{
    var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);done(ok);

function fallbackDownload(blob,fname){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1500);
  toast("PDF wird heruntergeladen",2200);
}

// Strategie: synchron lesbarer RAM-Cache (_draftCache) als Single Source of Truth
// zur Laufzeit; jede Änderung wird asynchron nach IndexedDB gespiegelt. So bleibt
// der gesamte bestehende synchrone Code (loadDrafts/saveDrafts) unverändert nutzbar.
var IDB_NAME="prisma_uebergabe";
var IDB_STORE="kv";
var _idb=null;              // offene DB-Verbindung
var _draftCache=null;      // {id->{id,title,ts,data}} – synchron im RAM
var _idbReady=false;

function idbOpen(cb){
  if(_idb){cb(_idb);return;}
  var req;
  try{req=indexedDB.open(IDB_NAME,1);}catch(e){cb(null);return;}
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
  };
  req.onsuccess=function(e){_idb=e.target.result;cb(_idb);};
  req.onerror=function(){cb(null);};
}
function idbGet(key,cb){
  idbOpen(function(db){
    if(!db){cb(null);return;}
    try{
      var tx=db.transaction(IDB_STORE,"readonly");
      var rq=tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess=function(){cb(rq.result!==undefined?rq.result:null);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  });
}
function idbSet(key,val,cb){
  idbOpen(function(db){
    if(!db){if(cb)cb(false);return;}
    try{
      var tx=db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(val,key);
      tx.oncomplete=function(){if(cb)cb(true);};
      tx.onerror=function(){if(cb)cb(false);};
    }catch(e){if(cb)cb(false);}
  });
}

var _idbWritePending=false,_idbWriteAgain=false;
function idbFlushDrafts(){
  if(_idbWritePending){_idbWriteAgain=true;return;}
  _idbWritePending=true;
  idbSet("drafts",_draftCache||{},function(){
    _idbWritePending=false;
    if(_idbWriteAgain){_idbWriteAgain=false;idbFlushDrafts();}
  });
}


function migrateData(d){
  // Sicherstellen, dass neue Felder existieren (alte Stände)
  if(!d.zaehler)d.zaehler=[];
  if(!d.datum)d.datum=todayISO();
  d.zaehler.forEach(function(z){if(!z.ablese)z.ablese=d.datum;if(z.einheit===undefined)z.einheit=(ZAE_EINHEIT[z._sel||z.art]||"");});
  if(d.iban===undefined)d.iban="";
  if(d.nachfolge===undefined)d.nachfolge="";
  if(!d.raeume)d.raeume=[];
  d.raeume.forEach(function(r){if(r._open===undefined)r._open=false;if(r.beschreibung===undefined)r.beschreibung="";if(r._ratedVisible===undefined)r._ratedVisible=false;if(r.massnahme===undefined)r.massnahme="";});
  // Alt-Format: separate Mängel-Karten -> in Raum-Beschreibung übernehmen
  if(d.maengel&&d.maengel.length){
    d.maengel.forEach(function(m){
      var name=m._rsel||m.raum||"WEITERES";
      var r=null,i;
      for(i=0;i<d.raeume.length;i++){if(d.raeume[i].r===name){r=d.raeume[i];break;}}
      if(!r){r={r:name,ok:false,zustand:"",schwere:"",massnahme:"",beschreibung:"",fotos:[],_open:false};d.raeume.push(r);}
      if(!r)return;
      var t=(m.mangel||"").trim()+(m.bem?" ("+m.bem+")":"");
      if(t)r.beschreibung=(r.beschreibung?r.beschreibung+"\n":"")+t;
      if(m.foto)r.fotos.push({data:m.foto,bez:""});
      if(r.zustand!=="mittel"&&r.zustand!=="schlecht"){r.zustand="mittel";r.ok=true;}
    });
    d.maengel=[];
  }
  // v15: Zustandsmodell 2-stufig (gut | mangel) + Schweregrad je Raum
  d.raeume.forEach(function(r){
    if(r.zustand==="mittel"){r.zustand="mangel";if(!r.schwere)r.schwere="mittel";}
    else if(r.zustand==="schlecht"){r.zustand="mangel";if(!r.schwere)r.schwere="schwer";}
    if(r.schwere===undefined)r.schwere="";
  });
  if(d.sig_v_ts===undefined)d.sig_v_ts=null;
  if(d.sig_m_ts===undefined)d.sig_m_ts=null;
  if(d.ba===undefined)d.ba=false;
  if(d.ba_art===undefined)d.ba_art="";
  if(d.art===undefined)d.art="wohnung";      // Bestandsentwürfe sind Wohnungen
  if(d.bs===undefined)d.bs=false;
  if(d.nachsend===undefined)d.nachsend=false;
  if(d.nachsend_frist===undefined)d.nachsend_frist="";
  if(d.mv_ende===undefined)d.mv_ende="";
  if(d.sk_fehlen===undefined)d.sk_fehlen="";
  if(d.mieter_vd===undefined)d.mieter_vd="";
  if(d.bestandsobjekt===undefined)d.bestandsobjekt="";
  if(d.karten===undefined)d.karten=[{nr:"",bez:"",fotos:[]}];
  d.karten.forEach(function(k){if(!k.fotos)k.fotos=[];}); // v2.0 (#20)
  d.raeume.forEach(function(r){r._open=false;}); // v2.0 (#21): alte Entwürfe zugeklappt starten
  if(d._sent===undefined)d._sent=false; // v2.0 (#26)
  if(d._sent_ts===undefined)d._sent_ts="";
  if(d.verlust_eur===undefined)d.verlust_eur="15";
  return d;
}

function easterEgg(){
  _eggActive=true;
  var ov=document.createElement("div");
  ov.id="egg-ov";
  ov.style.cssText="position:fixed;inset:0;z-index:3000;pointer-events:none;overflow:hidden";
  ov.innerHTML='<canvas id="egg-cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>'+
    '<div id="egg-msg" style="position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);background:#fff;border:2px solid #eb5b36;border-radius:14px;padding:16px 22px;font-size:15.5px;font-weight:700;color:#1a1a1a;box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s">Gebaut von JB für Team PRISMA ❤️</div>';
  document.body.appendChild(ov);
  var cv=ov.querySelector("#egg-cv");
  var W=window.innerWidth,H=window.innerHeight;
  cv.width=W;cv.height=H;
  var ctx=cv.getContext("2d");
  var farben=["#eb5b36","#f0997b","#575656","#f7c94b","#5dcaa5","#378add"];
  var parts=[];
  for(var i=0;i<90;i++){
    parts.push({
      x:Math.random()*W, y:-20-Math.random()*H*0.4,
      w:6+Math.random()*6, h:9+Math.random()*8,
      vy:2+Math.random()*3, vx:(Math.random()-0.5)*1.6,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.25,
      c:farben[Math.floor(Math.random()*farben.length)]
    });
  }
  var start=Date.now(),raf;
  function frame(){
    var t=Date.now()-start;
    ctx.clearRect(0,0,W,H);
    var fade=t>3000?Math.max(0,1-(t-3000)/800):1;
    ctx.globalAlpha=fade;
    parts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(t<3800){raf=requestAnimationFrame(frame);}
    else{
      var msg=ov.querySelector("#egg-msg");
      if(msg){msg.style.opacity="0";msg.style.transform="translate(-50%,-50%) scale(.7)";}
      setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);_eggActive=false;},350);
    }
  }
  raf=requestAnimationFrame(frame);
  setTimeout(function(){
    var msg=ov.querySelector("#egg-msg");
    if(msg){msg.style.opacity="1";msg.style.transform="translate(-50%,-50%) scale(1)";}
  },200);
}

// v2.0 (#29): "Weiter"/Enter springt ins nächste Eingabefeld (statt Formular abzuschicken)
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var el=e.target;
  if(!el||el.tagName!=="INPUT")return;
  var typ=(el.getAttribute("type")||"text").toLowerCase();
  if(typ==="date"||typ==="file"||typ==="checkbox"||typ==="radio")return;
  var scope=ge("content")||document;
  var felder=Array.prototype.filter.call(scope.querySelectorAll("input,textarea,select"),function(f){
    var t=(f.getAttribute("type")||"text").toLowerCase();
    if(t==="file"||t==="checkbox"||t==="radio"||t==="hidden")return false;
    return f.offsetParent!==null&&!f.disabled&&!f.readOnly;
  });
  var idx=felder.indexOf(el);
  if(idx>=0&&idx<felder.length-1){
    e.preventDefault();
    var nx=felder[idx+1];
    try{nx.focus();if(nx.select&&(nx.getAttribute("type")||"text")!=="date")nx.select();}catch(_){}
  }else if(idx===felder.length-1){
    e.preventDefault();
    try{el.blur();}catch(_){}
  }
});

// v2.0 (#28) / v2.2: Datenverlust-Schutz – bei Verlassen/Wegwischen sicher persistieren
function sicherSpeichern(){
  try{
    if(_screen==="form"){ if(istEinseiter())saveSingle(); else{ saveStep(); if(typeof saveMangelStep==="function")saveMangelStep(); } persist(); }
    // IndexedDB-Spiegelung sofort anstoßen (nicht auf verzögerten Flush warten)
    if(_draftCache)idbSet("drafts",_draftCache,function(){});
  }catch(e){}
}
window.addEventListener("pagehide",sicherSpeichern);
window.addEventListener("beforeunload",sicherSpeichern);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")sicherSpeichern();});

loadObjekte();

// ── v2.2 (#2): einmaliger Voll-Reset + Entwürfe aus IndexedDB in den RAM-Cache ─
function appStart(){
  // 1) Einmaliger kompletter Reset beim ersten Start nach dem Update
  var resetDone=false;
  try{resetDone=localStorage.getItem(RESET_FLAG_KEY)==="1";}catch(e){}
  if(!resetDone){
    // Alle Alt-Daten entfernen: Entwürfe (localStorage-Legacy), Namens-Historie,
    // durchführende Person, aktuelle ID – kompletter Neustart auf neuer Architektur.
    try{localStorage.removeItem(DRAFTS_KEY);}catch(e){}
    try{localStorage.removeItem(CURRENT_KEY);}catch(e){}
    try{localStorage.removeItem(VW_HIST_KEY);}catch(e){}
    try{localStorage.removeItem(VW_KEY);}catch(e){}
    _draftCache={};
    idbSet("drafts",{},function(){});      // IndexedDB ebenfalls leeren
    try{localStorage.setItem(RESET_FLAG_KEY,"1");}catch(e){}
    showStart();
    return;
  }
  // 2) Normalstart: Entwürfe aus IndexedDB in den synchronen RAM-Cache laden
  idbGet("drafts",function(data){
    _draftCache=(data&&typeof data==="object")?data:{};
    _idbReady=true;
    showStart();
  });
}
appStart();
